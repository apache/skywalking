name: Publish E2E service images

on:
  push:
    branches:
      - master
    paths:
      - 'test/e2e-v2/java-test-service/**'
      - 'test/Makefile'

env:
  SKIP_TEST: true
  HUB: ghcr.io/apache/skywalking

jobs:
  build:
    if: github.repository == 'apache/skywalking'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    timeout-minutes: 90
    env:
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      # e2e-spring-ai-service is a Spring Boot 4 / Spring AI module gated behind the reactor's
      # jdk-17 profile; without an explicit JDK this job rides the runner image default.
      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Cache local Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.HUB }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push images
        run: make -C test build.e2e-service docker.push-e2e-service

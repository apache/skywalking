# The verify case of the second OAP, which the banyandb e2e alone runs: one with the hide setting, over the same
# storage as the first. The paths are from the repository root, the expected file beside this file.
cases:
  # the prompt-snapshot-withheld conversation as the OAP with the hide setting serves it, against the first OAP's
  # whole document and stored files: the named steps lose their text and every count stays; a served file is masked
  # where it holds what is withheld, and is the stored bytes everywhere else
  - query: bash test/e2e-v2/cases/ai-agent/verify.sh withheld http://${oaphide_host}:${oaphide_12800} http://${oap_host}:${oap_12800}
    expected: expected/withheld.yml

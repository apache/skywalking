# Workspace changes beside the steps.
#
# Three tools change files, each recorded the way its producer records it.
# A shell command on the main stream: the plugin observed it and wrote a
# change record with every file it changed, two here. An Edit on the main
# stream: the runtime recorded its own patch on the result, and the
# adapter carries it beside the raw result. A shell command inside a
# subagent: the plugin again, under the child's stream. Every record joins
# its step by the tool-use id, and none of them is a step: the same session
# without the changes folds to the same nodes.
title: workspace changes beside the steps
steps:
  - input: raise the timeout and add a configuration file
  - call:
      text: Changing both.
      tool:
        name: Bash
        input: {command: "sed -i 's/= 10/= 30/' server.go && printf 'timeout: 30\\n' > config.yaml"}
        result: {text: "", after: 500ms}
        changes:
          - {path: server.go, before: "package main\n\nvar timeout = 10\n", after: "package main\n\nvar timeout = 30\n"}
          - {path: config.yaml, after: "timeout: 30\n"}
  - call:
      text: Naming the unit.
      tool:
        name: Edit
        input: {file_path: /Users/dev/scenario/server.go, old_string: "var timeout = 30", new_string: "var timeoutSeconds = 30"}
        result: {text: "The file has been updated.", after: 200ms}
        changes:
          - {path: server.go, before: "package main\n\nvar timeout = 30\n", after: "package main\n\nvar timeoutSeconds = 30\n"}
  - call:
      agent:
        name: tidier
        prompt: remove the stale notes
        notify: true
        steps:
          - call:
              text: Removing them.
              tool:
                name: Bash
                input: {command: rm notes.txt}
                result: {text: "", after: 300ms}
                changes:
                  - {path: notes.txt, before: "old notes\n"}
          - call: {text: Removed.}
  - call: {text: Done.}

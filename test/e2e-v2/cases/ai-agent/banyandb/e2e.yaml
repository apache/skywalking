# AI agent conversations landed by the AI Sessionizer, on BanyanDB: three sessions generated from one
# scenario and one session generated in three stages, parsed, pushed over OTLP, then read back through swctl
# and the view route and compared, document for document, with what the Sessionizer's own viewer serves.

setup:
  env: compose
  file: docker-compose.yml
  timeout: 20m
  init-system-environment: ../../../script/env
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH
    - name: install yq
      command: bash test/e2e-v2/script/prepare/setup-e2e-shell/install.sh yq
    - name: install swctl
      command: bash test/e2e-v2/script/prepare/setup-e2e-shell/install.sh swctl

verify:
  retry:
    count: 30
    interval: 10s
  cases:
    - includes:
        - ../ai-agent-cases.yaml

cleanup:
  on: always
  collect:
    on: failure
    output-dir: $SW_INFRA_E2E_LOG_DIR/banyandb-data
    items:
      - service: banyandb
        paths:
          - /tmp/stream/
          - /tmp/measure/
          - /tmp/property/
          - /tmp/schema-property/

# A landed file deleted from the storage root after a round bound to it.
# The structure survives, since it lives in the rounds; the file's text is
# gone; and everything that reads the root says so. The session goes on
# afterwards, and the later rounds are whole. The expectation file names
# the file to lose and what asz verify and the document must report.
title: a landed file lost
steps:
  - input: read the configuration
  - call: {text: Reading it., tool: {name: Read, input: {path: asz.yaml}, result: "storage:\n  root: ./data"}}
  - call:
      text: Asking the helper.
      agent: {name: helper, prompt: read the docs, notify: true, steps: [{call: {text: The docs say 11800.}}]}
    checkpoint: helped
  - input: thanks
  - call: {text: You are welcome.}

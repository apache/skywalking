    expected: expected/metrics-has-value.yml
  - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression=gen_ai_model_output_tokens_avg --service-id=b3BlbmFp.0 --instance-name=gpt-4.1-mini-2025-04-14
    expected: expected/metrics-has-value.yml
  - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression=gen_ai_model_total_estimated_cost --service-id=b3BlbmFp.0 --instance-name=gpt-4.1-mini-2025-04-14
    expected: expected/metrics-has-value.yml
  - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression=gen_ai_model_avg_estimated_cost --service-id=b3BlbmFp.0 --instance-name=gpt-4.1-mini-2025-04-14
    expected: expected/metrics-has-value.yml

  # AI evaluation metric. The mock judge returns Faithfulness = 0.8, stored as 800000 ppm.
  - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression=gen_ai_model_evaluation_score_ppm --service-id=b3BlbmFp.0 --instance-name=gpt-4.1-mini-2025-04-14
    expected: expected/evaluation-score-metric.yml

  # SCORE record. The dynamic trace fields are normalized before matching.
  - query: |
      START=$(date -u -v-1H '+%Y-%m-%d %H%M' 2>/dev/null || date -u -d '1 hour ago' '+%Y-%m-%d %H%M')
      END=$(date -u '+%Y-%m-%d %H%M')
      curl -s -X POST http://${oap_host}:${oap_12800}/graphql \
        -H 'Content-Type: application/json' \
        -d '{"query":"query ($condition: GenAIEvaluationRecordQueryCondition!) { queryGenAIEvaluationRecord(condition: $condition) { genAIEvaluationRecordList { traceRef { type traceId segmentId spanIndex spanId } serviceName providerName modelName operationName taskName valueType scoreValue booleanValue stringValue evaluationLevel reason judgeModel evaluationTime } } }","variables":{"condition":{"providerId":"b3BlbmFp.0","taskName":"Faithfulness","valueType":"SCORE","minScore":800000,"maxScore":800000,"queryDuration":{"start":"'"$START"'","end":"'"$END"'","step":"MINUTE"},"paging":{"pageNum":1,"pageSize":1},"sortBy":"SCORE_VALUE","queryOrder":"DES"}}}' \
        | yq -P '.data.queryGenAIEvaluationRecord.genAIEvaluationRecordList[0] | {traceType: .traceRef.type, hasTraceId: (.traceRef.traceId != null and .traceRef.traceId != ""), hasSegmentId: (.traceRef.segmentId != null and .traceRef.segmentId != ""), hasSpanIndex: (.traceRef.spanIndex != null), hasSpanId: (.traceRef.spanId != null), serviceName: .serviceName, providerName: .providerName, modelName: .modelName, operationName: .operationName, taskName: .taskName, valueType: .valueType, scoreValue: .scoreValue, booleanValue: .booleanValue, stringValue: .stringValue, evaluationLevel: .evaluationLevel, reason: .reason, judgeModel: .judgeModel, hasEvaluationTime: (.evaluationTime != null)}'
    expected: expected/evaluation-score-record.yml

  # BOOLEAN record. It uses the same storage number column but is exposed through booleanValue.
  - query: |
      START=$(date -u -v-1H '+%Y-%m-%d %H%M' 2>/dev/null || date -u -d '1 hour ago' '+%Y-%m-%d %H%M')
      END=$(date -u '+%Y-%m-%d %H%M')
      curl -s -X POST http://${oap_host}:${oap_12800}/graphql \
        -H 'Content-Type: application/json' \
        -d '{"query":"query ($condition: GenAIEvaluationRecordQueryCondition!) { queryGenAIEvaluationRecord(condition: $condition) { genAIEvaluationRecordList { traceRef { type traceId segmentId spanIndex spanId } serviceName providerName modelName operationName taskName valueType scoreValue booleanValue stringValue evaluationLevel reason judgeModel evaluationTime } } }","variables":{"condition":{"providerId":"b3BlbmFp.0","taskName":"TaskCompletion","valueType":"BOOLEAN","booleanValue":true,"queryDuration":{"start":"'"$START"'","end":"'"$END"'","step":"MINUTE"},"paging":{"pageNum":1,"pageSize":1},"sortBy":"EVALUATION_TIME","queryOrder":"DES"}}}' \
        | yq -P '.data.queryGenAIEvaluationRecord.genAIEvaluationRecordList[0] | {traceType: .traceRef.type, hasTraceId: (.traceRef.traceId != null and .traceRef.traceId != ""), hasSegmentId: (.traceRef.segmentId != null and .traceRef.segmentId != ""), hasSpanIndex: (.traceRef.spanIndex != null), hasSpanId: (.traceRef.spanId != null), serviceName: .serviceName, providerName: .providerName, modelName: .modelName, operationName: .operationName, taskName: .taskName, valueType: .valueType, scoreValue: .scoreValue, booleanValue: .booleanValue, stringValue: .stringValue, evaluationLevel: .evaluationLevel, reason: .reason, judgeModel: .judgeModel, hasEvaluationTime: (.evaluationTime != null)}'
    expected: expected/evaluation-boolean-record.yml

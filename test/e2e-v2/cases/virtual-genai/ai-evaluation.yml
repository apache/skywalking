judge:
  provider: openai
  endpoint: ${AI_EVALUATION_ENDPOINT:}
  model: ${AI_EVALUATION_MODEL:e2e-judge}
  api-key: ${AI_EVALUATION_API_KEY:}
  request-timeout-seconds: 30
  max-retries: 0

system-prompt: |
  Return one JSON object containing every requested evaluation task.
  Each task must contain a value and a concise reason.

level:
  undefined: undefined
  score:
    - min: 0.0
      max: 0.3
      level: fail
    - min: 0.3
      max: 0.6
      level: warning
    - min: 0.6
      max: 0.85
      level: good
    - min: 0.85
      max: 1.0
      level: excellent
  boolean:
    "true": excellent
    "false": fail

tasks:
  - name: Faithfulness
    valueType: SCORE
    instruction: Evaluate factual grounding.
  - name: TaskCompletion
    valueType: BOOLEAN
    instruction: Evaluate whether the task was completed.

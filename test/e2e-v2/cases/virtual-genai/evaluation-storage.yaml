# The store holding the judged span, which depends on how this case's OAP receives spans:
# SkyWalking agent segments.
cases:
  - query: |
      START=$(date -u -v-1H '+%Y-%m-%d %H%M' 2>/dev/null || date -u -d '1 hour ago' '+%Y-%m-%d %H%M')
      END=$(date -u '+%Y-%m-%d %H%M')
      curl -s -X POST http://${oap_host}:${oap_12800}/graphql \
        -H 'Content-Type: application/json' \
        -d '{"query":"query ($condition: GenAIEvaluationRecordQueryCondition!) { queryGenAIEvaluationRecord(condition: $condition) { genAIEvaluationRecordList { traceRef { type } } } }","variables":{"condition":{"providerId":"b3BlbmFp.0","queryDuration":{"start":"'"$START"'","end":"'"$END"'","step":"MINUTE"},"paging":{"pageNum":1,"pageSize":1}}}}' \
        | yq -P '.data.queryGenAIEvaluationRecord.genAIEvaluationRecordList[0].traceRef'
    expected: expected/evaluation-storage.yml

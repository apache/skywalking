# A producer and a consumer instrumented by the OpenTelemetry Python confluent-kafka instrumentation reach one Kafka
# broker through two names: the instrumentation reports the first bootstrap entry as server.address, so the producer's
# broker is `kafka:9092` and the consumer's `kafka-node:9092`. server-clusters.yml lists both under kafka-prod, so the
# trace analysis draws one broker, kafka-prod, between them.

x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://oap:11800
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_BSP_SCHEDULE_DELAY: "1000"
  OTEL_RESOURCE_ATTRIBUTES: service.layer=OTLP_GENERAL

services:
  oap:
    extends:
      file: ../../../script/docker-compose/base-compose.yml
      service: oap
    ports:
      - 12800
    volumes:
      - ./server-clusters.yml:/skywalking/config/server-clusters.yml
    networks:
      e2e:

  banyandb:
    extends:
      file: ../../../script/docker-compose/base-compose.yml
      service: banyandb
    ports:
      - 17912
    networks:
      e2e:

  producer:
    build:
      context: kafka
    command: ["opentelemetry-instrument", "python", "/producer.py"]
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: orders-producer
      BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      oap:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      e2e:

  consumer:
    build:
      context: kafka
    command: ["opentelemetry-instrument", "python", "/consumer.py"]
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: orders-consumer
      BOOTSTRAP_SERVERS: kafka-node:9092
    depends_on:
      oap:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      e2e:

  zookeeper:
    image: 'zookeeper:3.9.3'
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    networks:
      e2e:

  kafka:
    image: 'bitnamilegacy/kafka:2.4.1'
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - zookeeper
    networks:
      e2e:
        aliases:
          - kafka-node

networks:
  e2e:

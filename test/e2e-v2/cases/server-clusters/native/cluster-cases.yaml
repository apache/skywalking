cases:
  # Both producers' peers, in either order, and the consumer's broker are the one service kafka-prod.
  - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql service ls
    expected: expected/service.yml
  - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression=service_relation_client_cpm --service-name=e2e-producer-a --dest-service-id=a2Fma2EtcHJvZA==.0
    expected: expected/metrics-has-value.yml
  - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression=service_relation_client_cpm --service-name=e2e-producer-b --dest-service-id=a2Fma2EtcHJvZA==.0
    expected: expected/metrics-has-value.yml
  - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression=service_relation_server_cpm --service-id=a2Fma2EtcHJvZA==.0 --dest-service-name=e2e-service-consumer
    expected: expected/metrics-has-value.yml
  - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql endpoint list --service-id=a2Fma2EtcHJvZA==.0
    expected: expected/service-endpoint.yml

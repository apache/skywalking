services:
  oap:
    extends:
      file: ../../../script/docker-compose/base-compose.yml
      service: oap
    environment:
      SW_OTEL_RECEIVER: default
      SW_OTEL_RECEIVER_ENABLED_OTEL_METRICS_RULES: vm,process-hostmetrics-linux
    volumes:
      - ./otel-rules/vm.yaml:/skywalking/config/otel-rules/vm.yaml
      - ./otel-rules/process-hostmetrics-linux.yaml:/skywalking/config/otel-rules/process-hostmetrics-linux.yaml
    ports:
      - 12800

  banyandb:
    extends:
      file: ../../../script/docker-compose/base-compose.yml
      service: banyandb
    ports:
      - 17912

  vm-service:
    hostname: vm-service
    build:
      context: .
      dockerfile: Dockerfile.otelcol
      args:
        OTEL_COLLECTOR_CONTRIB_VERSION: ${OTEL_COLLECTOR_CONTRIB_VERSION}
    networks:
      - e2e
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    depends_on:
      oap:
        condition: service_healthy

networks:
  e2e:

# Windows infrastructure MAL.
#
# The existing windows-exporter source and the OpenTelemetry hostmetrics source
# intentionally use the same existing job_name "windows-monitoring". One MAL
# file maps either input family to the canonical meter_win_* targets, avoiding
# cross-file metric ownership collisions in OAP 11.
filter: "{ tags -> tags.job_name == 'windows-monitoring' }"
expSuffix: service(['node_identifier_host_name'], Layer.OS_WINDOWS)
metricPrefix: meter_win

metricsRules:
  # ---------------------------------------------------------------------------
  # Canonical windows.yaml metrics, now accepting either source.
  # ---------------------------------------------------------------------------

  # CPU
  - name: cpu_total_percentage
    exp: >
      (windows_cpu_time_total * 100)
        .tagNotEqual('mode','idle')
        .sum(['node_identifier_host_name'])
        .rate('PT1M')
      +
      (system_cpu_time * 100)
        .tagNotEqual('mode','idle')
        .sum(['node_identifier_host_name'])
        .rate('PT1M')

  - name: cpu_average_used
    exp: >
      (windows_cpu_time_total * 100)
        .sum(['node_identifier_host_name','mode'])
        .rate('PT1M')
      +
      (system_cpu_time * 100)
        .sum(['node_identifier_host_name','mode'])
        .rate('PT1M')

  # Physical memory
  - name: memory_total
    exp: >
      windows_cs_physical_memory_bytes
      +
      system_memory_limit.sum(['node_identifier_host_name'])

  - name: memory_available
    exp: >
      windows_os_physical_memory_free_bytes
      +
      system_memory_usage
        .tagEqual('state','free')
        .sum(['node_identifier_host_name'])

  - name: memory_used
    exp: >
      (windows_cs_physical_memory_bytes - windows_os_physical_memory_free_bytes)
      +
      (
        system_memory_limit.sum(['node_identifier_host_name'])
        -
        system_memory_usage.tagEqual('state','free').sum(['node_identifier_host_name'])
      )

  # Canonical virtual memory semantics.
  # The hostmetrics branch uses Windows Performance Counters:
  #   Memory\\Commit Limit
  #   Memory\\Committed Bytes
  - name: memory_virtual_memory_free
    exp: >
      windows_os_virtual_memory_free_bytes
      +
      (
        system_virtual_memory_commit_limit.sum(['node_identifier_host_name'])
        -
        system_virtual_memory_committed.sum(['node_identifier_host_name'])
      )

  - name: memory_virtual_memory_total
    exp: >
      windows_os_virtual_memory_bytes
      +
      system_virtual_memory_commit_limit.sum(['node_identifier_host_name'])

  - name: memory_virtual_memory_percentage
    exp: >
      (
        100 - ((windows_os_virtual_memory_free_bytes * 100) / windows_os_virtual_memory_bytes)
      )
      +
      (
        system_virtual_memory_committed.sum(['node_identifier_host_name']) * 100
        /
        system_virtual_memory_commit_limit.sum(['node_identifier_host_name'])
      )

  # Disk throughput
  - name: disk_read
    exp: >
      windows_logical_disk_read_bytes_total
        .sum(['node_identifier_host_name'])
        .rate('PT1M')
      +
      system_disk_io
        .tagEqual('direction','read')
        .sum(['node_identifier_host_name'])
        .rate('PT1M')

  - name: disk_written
    exp: >
      windows_logical_disk_write_bytes_total
        .sum(['node_identifier_host_name'])
        .rate('PT1M')
      +
      system_disk_io
        .tagEqual('direction','write')
        .sum(['node_identifier_host_name'])
        .rate('PT1M')

  # Network throughput
  - name: network_receive
    exp: >
      windows_net_bytes_received_total
        .sum(['node_identifier_host_name'])
        .irate()
      +
      system_network_io
        .tagEqual('direction','receive')
        .sum(['node_identifier_host_name'])
        .irate()

  - name: network_transmit
    exp: >
      windows_net_bytes_sent_total
        .sum(['node_identifier_host_name'])
        .irate()
      +
      system_network_io
        .tagEqual('direction','transmit')
        .sum(['node_identifier_host_name'])
        .irate()

  # ---------------------------------------------------------------------------
  # Additional hostmetrics capabilities. These are additive and do not change
  # the existing windows-exporter metric contract.
  # ---------------------------------------------------------------------------
  - name: cpu_cores_num
    exp: system_cpu_logical_count.sum(['node_identifier_host_name'])

  - name: cpu_norm_percentage
    exp: >
      (
        (system_cpu_time * 100)
          .tagNotEqual('mode','idle')
          .sum(['node_identifier_host_name'])
          .rate('PT1M')
      )
      /
      system_cpu_logical_count.sum(['node_identifier_host_name'])

  - name: cpu_load1
    exp: system_cpu_load_average_1m.sum(['node_identifier_host_name']) * 100

  - name: cpu_load5
    exp: system_cpu_load_average_5m.sum(['node_identifier_host_name']) * 100

  - name: cpu_load15
    exp: system_cpu_load_average_15m.sum(['node_identifier_host_name']) * 100

  - name: filesystem_percentage
    exp: >
      100 - (
        (system_filesystem_usage.tagEqual('state','free') * 100)
          .sum(['node_identifier_host_name','mountpoint'])
        /
        (
          system_filesystem_usage.tagEqual('state','free')
            .sum(['node_identifier_host_name','mountpoint'])
          +
          system_filesystem_usage.tagEqual('state','reserved')
            .sum(['node_identifier_host_name','mountpoint'])
          +
          system_filesystem_usage.tagEqual('state','used')
            .sum(['node_identifier_host_name','mountpoint'])
        )
      )

  - name: filehandles_allocated
    exp: system_filehandles_allocated.sum(['node_identifier_host_name'])

  # system.paging.usage is the Windows pagefile, not the windows.yaml virtual
  # memory metric. Keep it under explicit new names.
  - name: memory_pagefile_free
    exp: >
      system_paging_usage
        .tagEqual('state','free')
        .sum(['node_identifier_host_name'])

  - name: memory_pagefile_total
    exp: system_paging_usage.sum(['node_identifier_host_name'])

  - name: memory_pagefile_percentage
    exp: >
      (
        system_paging_usage
          .tagEqual('state','used')
          .sum(['node_identifier_host_name'])
        * 100
      )
      /
      system_paging_usage.sum(['node_identifier_host_name'])

# The Collector normalizes process identity and pre-aggregates operating-system
# processes with the same process_name before OTLP export. MAL maps the
# resulting logical process metrics to the corresponding SkyWalking instance.
filter: "{ tags -> tags.job_name == 'hostmetrics-process-monitoring-windows' }"

expSuffix: |-
  service(['node_identifier_host_name'], '', Layer.OS_WINDOWS)
    .instance(
      ['node_identifier_host_name'],
      '',
      ['process_name'],
      '',
      Layer.OS_WINDOWS,
      {
        tags -> [
          'process_name': tags.process_name,
          'host': tags.node_identifier_host_name
        ]
      }
    )

metricPrefix: mp_process_windows

metricsRules:
  - name: num_procs
    exp: "process_count.sum(['node_identifier_host_name','process_name'])"

  - name: num_threads
    exp: "process_threads.sum(['node_identifier_host_name','process_name'])"

  - name: cpu_total_percent
    exp: >
      process_cpu_utilization
        .tagNotEqual('state','wait')
        .sum(['node_identifier_host_name','process_name'])
      * 100

  - name: cpu_user_percent
    exp: >
      process_cpu_utilization
        .tagEqual('state','user')
        .sum(['node_identifier_host_name','process_name'])
      * 100

  - name: cpu_system_percent
    exp: >
      process_cpu_utilization
        .tagEqual('state','system')
        .sum(['node_identifier_host_name','process_name'])
      * 100

  - name: memory_resident_bytes
    exp: "process_memory_usage.sum(['node_identifier_host_name','process_name'])"

  # process.memory.utilization is emitted as a [0,1] fraction. Multiply by
  # 100 before SkyWalking fixed-point storage to preserve two decimal places
  # of percentage precision (basis points). UI expressions must divide the
  # stored metric by 100.
  - name: memory_resident_percent
    exp: >
      process_memory_utilization
        .sum(['node_identifier_host_name','process_name'])
      * 100

  - name: open_handles
    exp: "process_open_handles.sum(['node_identifier_host_name','process_name'])"

  - name: oldest_process_uptime_seconds
    exp: "process_uptime.max(['node_identifier_host_name','process_name'])"

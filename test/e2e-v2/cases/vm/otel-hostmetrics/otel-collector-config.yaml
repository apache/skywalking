#
# E2E configuration for OpenTelemetry-native Linux host/process monitoring.
#
# Differences from the production/reference configuration:
#   - collection_interval is 5s instead of 30s
#   - process allowlist contains only "^sleep$"
#   - OTLP endpoint is the Docker Compose service "oap:11800"
#

receivers:

  # ---------------------------------------------------------------------------
  # Host metrics
  # ---------------------------------------------------------------------------
  hostmetrics/system:
    collection_interval: 5s

    scrapers:

      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true

          system.cpu.logical.count:
            enabled: true

      memory:
        metrics:
          system.linux.memory.available:
            enabled: true

          system.memory.limit:
            enabled: true

      disk: {}

      network: {}

      filesystem: {}

      paging: {}

      load: {}


  # ---------------------------------------------------------------------------
  # Process metrics
  #
  # The E2E workload starts exactly three "sleep" processes.
  # Only those processes are collected.
  # ---------------------------------------------------------------------------
  hostmetrics/processes:
    collection_interval: 5s

    scrapers:

      process:

        include:
          match_type: regexp
          names:
            - "^sleep$"

        mute_process_all_errors: true

        metrics:

          process.cpu.time:
            enabled: false

          process.cpu.utilization:
            enabled: true

          process.memory.usage:
            enabled: true

          process.memory.virtual:
            enabled: false

          process.memory.utilization:
            enabled: true

          process.threads:
            enabled: true

          process.uptime:
            enabled: true

          process.open_file_descriptors:
            enabled: true

          process.context_switches:
            enabled: false

          process.paging.faults:
            enabled: false

          process.signals_pending:
            enabled: false

          process.disk.io:
            enabled: false

          process.disk.operations:
            enabled: false

        resource_attributes:

          # This is the only process identity attribute required.
          process.executable.name:
            enabled: true

          process.executable.path:
            enabled: false

          process.command:
            enabled: false

          process.command_line:
            enabled: false

          process.owner:
            enabled: false

          process.pid:
            enabled: false

          process.parent_pid:
            enabled: false


processors:

  # ---------------------------------------------------------------------------
  # Detect host.name.
  #
  # Because docker-compose.yml sets:
  #
  #   hostname: vm-service
  #
  # this should produce:
  #
  #   host.name = vm-service
  #
  # ---------------------------------------------------------------------------
  resource_detection/system:
    detectors:
      - system

    override: true

    system:
      hostname_sources:
        - os


  # ---------------------------------------------------------------------------
  # Host identity / routing
  #
  # Makes hostmetrics use the same canonical SkyWalking VM model as the
  # existing node-exporter integration:
  #
  #   node_identifier_host_name = host.name
  #   job_name                  = vm-monitoring
  #
  # CPU state is renamed to "mode" to preserve the canonical vm.yaml shape.
  # ---------------------------------------------------------------------------
  transform/host-linux:
    error_mode: ignore

    metric_statements:

      - context: resource
        statements:

          - set(
              resource.attributes["node_identifier_host_name"],
              resource.attributes["host.name"]
            ) where resource.attributes["host.name"] != nil

          - set(
              resource.attributes["job_name"],
              "vm-monitoring"
            )

      - context: datapoint
        statements:

          - set(
              datapoint.attributes["mode"],
              datapoint.attributes["state"]
            ) where metric.name == "system.cpu.utilization" and datapoint.attributes["state"] != nil

          - delete_key(
              datapoint.attributes,
              "state"
            ) where metric.name == "system.cpu.utilization"

          - set(
              datapoint.attributes["protocol"],
              ConvertCase(datapoint.attributes["protocol"], "lower")
            ) where metric.name == "system.network.connections" and datapoint.attributes["protocol"] != nil

          - set(
              datapoint.attributes["state"],
              ConvertCase(datapoint.attributes["state"], "lower")
            ) where metric.name == "system.network.connections" and datapoint.attributes["state"] != nil


  # ---------------------------------------------------------------------------
  # Process identity
  #
  # Converts:
  #
  #   process.executable.name = sleep
  #
  # into:
  #
  #   node_identifier_host_name = vm-service
  #   job_name                  = hostmetrics-process-monitoring-linux
  #   process_name              = sleep
  #
  # PID is deliberately NOT part of the identity.
  # ---------------------------------------------------------------------------
  transform/process-identity-linux:
    error_mode: ignore

    metric_statements:

      - context: resource
        statements:

          - set(
              resource.attributes["node_identifier_host_name"],
              resource.attributes["host.name"]
            ) where resource.attributes["host.name"] != nil

          - set(
              resource.attributes["job_name"],
              "hostmetrics-process-monitoring-linux"
            )

          - set(
              resource.attributes["process_name"],
              ConvertCase(
                resource.attributes["process.executable.name"],
                "lower"
              )
            ) where resource.attributes["process.executable.name"] != nil

          # Generic Python normalization retained from the reference config.
          - replace_pattern(
              resource.attributes["process_name"],
              "^python[0-9.]*$",
              "python"
            ) where resource.attributes["process_name"] != nil

          # process_name is now the canonical process identity.
          - delete_key(
              resource.attributes,
              "process.executable.name"
            )


  # ---------------------------------------------------------------------------
  # Do not send process telemetry without a normalized process name.
  # ---------------------------------------------------------------------------
  filter/process-without-name-linux:
    error_mode: ignore

    metric_conditions:

      - resource.attributes["process_name"] == nil

      - resource.attributes["process_name"] == ""


  # ---------------------------------------------------------------------------
  # Prepare process metrics for aggregation.
  #
  # Linux FD:
  #   process.open_file_descriptors -> process.open_handles
  #
  # Process count:
  #   create one process.count sample for each process by copying the
  #   process.threads metric. Later aggregate_on_attributes("count", [])
  #   counts those samples.
  # ---------------------------------------------------------------------------
  transform/process-prepare-linux:
    error_mode: ignore

    metric_statements:

      - context: metric
        statements:

          - set(
              metric.name,
              "process.open_handles"
            ) where metric.name == "process.open_file_descriptors"

          - copy_metric(
              name="process.count",
              description="Number of processes in the normalized process group"
            ) where metric.name == "process.threads"


  # ---------------------------------------------------------------------------
  # Batch host telemetry.
  # ---------------------------------------------------------------------------
  batch/host-linux:
    timeout: 2s
    send_batch_size: 8192


  # ---------------------------------------------------------------------------
  # Batch individual process telemetry before grouping.
  # ---------------------------------------------------------------------------
  batch/process-linux:
    timeout: 2s
    send_batch_size: 8192


  # ---------------------------------------------------------------------------
  # Collapse ResourceMetrics belonging to the same normalized process group.
  #
  # process_name remains a resource attribute and therefore remains the
  # process group identity.
  #
  # PID is not present.
  # ---------------------------------------------------------------------------
  groupbyattrs/process-linux:
    keys: []


  # ---------------------------------------------------------------------------
  # Aggregate all PIDs belonging to the same process_name.
  #
  # For the E2E workload:
  #
  #   sleep PID A
  #   sleep PID B
  #   sleep PID C
  #
  # becomes one logical process group:
  #
  #   process_name = sleep
  #
  # with:
  #
  #   process.count = 3
  #
  # ---------------------------------------------------------------------------
  transform/process-aggregate-linux:
    error_mode: ignore

    metric_statements:

      - context: metric
        statements:

          # Number of actual processes in this normalized group.
          - aggregate_on_attributes(
              "count",
              []
            ) where metric.name == "process.count"

          # Total threads across the group.
          - aggregate_on_attributes(
              "sum",
              []
            ) where metric.name == "process.threads"

          # Preserve CPU state while aggregating all processes.
          - aggregate_on_attributes(
              "sum",
              ["state"]
            ) where metric.name == "process.cpu.utilization"

          # Total resident memory.
          - aggregate_on_attributes(
              "sum",
              []
            ) where metric.name == "process.memory.usage"

          # Aggregate process memory utilization.
          - aggregate_on_attributes(
              "sum",
              []
            ) where metric.name == "process.memory.utilization"

          # Total open file descriptors.
          - aggregate_on_attributes(
              "sum",
              []
            ) where metric.name == "process.open_handles"

          # Oldest process in the group.
          - aggregate_on_attributes(
              "max",
              []
            ) where metric.name == "process.uptime"


  # ---------------------------------------------------------------------------
  # Final batching before OTLP export.
  # ---------------------------------------------------------------------------
  batch/export:
    timeout: 2s
    send_batch_size: 8192


exporters:

  # ---------------------------------------------------------------------------
  # OAP service defined in docker-compose.yml.
  #
  # No authentication is required inside this isolated E2E network.
  # ---------------------------------------------------------------------------
  otlp:
    endpoint: oap:11800

    tls:
      insecure: true


service:

  pipelines:

    # -------------------------------------------------------------------------
    # Host telemetry -> vm.yaml
    # -------------------------------------------------------------------------
    metrics/host-linux:

      receivers:
        - hostmetrics/system

      processors:
        - resource_detection/system
        - transform/host-linux
        - batch/host-linux

      exporters:
        - otlp


    # -------------------------------------------------------------------------
    # Process telemetry -> process-hostmetrics-linux.yaml
    # -------------------------------------------------------------------------
    metrics/processes-linux:

      receivers:
        - hostmetrics/processes

      processors:
        - resource_detection/system
        - transform/process-identity-linux
        - filter/process-without-name-linux
        - transform/process-prepare-linux
        - batch/process-linux
        - groupbyattrs/process-linux
        - transform/process-aggregate-linux
        - batch/export

      exporters:
        - otlp

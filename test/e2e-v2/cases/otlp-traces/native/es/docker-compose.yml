services:
  es:
    image: elastic/elasticsearch:7.15.0
    expose:
      - 9200
    networks:
      - e2e
    environment:
      - discovery.type=single-node
      - cluster.routing.allocation.disk.threshold_enabled=false
      - xpack.security.enabled=false
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/9200"]
      interval: 5s
      timeout: 60s
      retries: 120

  oap:
    extends:
      file: ../../../../script/docker-compose/base-compose.yml
      service: oap
    ports:
      - 12800
      - 3200
    environment:
      SW_STORAGE: elasticsearch
      # Store the OTLP spans as they arrive instead of converting them to Zipkin.
      SW_OTEL_TRACE_STORAGE: otlp
      SW_TRACEQL: default
      SW_TRACEQL_ENABLE_DATASOURCE_OTLP: "true"
    depends_on:
      es:
        condition: service_healthy

  frontend:
    extends:
      file: ../docker-compose-demo.yml
      service: frontend
    depends_on:
      oap:
        condition: service_healthy
      productcatalogservice:
        condition: service_healthy
    networks:
      - e2e

  productcatalogservice:
    extends:
      file: ../docker-compose-demo.yml
      service: productcatalogservice
    depends_on:
      oap:
        condition: service_healthy
    networks:
      - e2e

networks:
  e2e:

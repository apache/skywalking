services:
  banyandb:
    extends:
      file: ../../../../script/docker-compose/base-compose.yml
      service: banyandb
    ports:
      - 17912

  oap:
    extends:
      file: ../../../../script/docker-compose/base-compose.yml
      service: oap
    ports:
      - 12800
      - 3200
    environment:
      SW_STORAGE: banyandb
      # Store the OTLP spans as they arrive instead of converting them to Zipkin.
      SW_OTEL_TRACE_STORAGE: otlp
      SW_TRACEQL: default
      SW_TRACEQL_ENABLE_DATASOURCE_OTLP: "true"
    depends_on:
      banyandb:
        condition: service_healthy

  frontend:
    extends:
      file: ../docker-compose-demo.yml
      service: frontend
    # Re-declared: infra-e2e reads this file for the ports it exports as ${frontend_8080}, not the extended one.
    ports:
      - 8080
    depends_on:
      oap:
        condition: service_healthy
      productcatalogservice:
        condition: service_healthy
    networks:
      - e2e

  productcatalogservice:
    extends:
      file: ../docker-compose-demo.yml
      service: productcatalogservice
    depends_on:
      oap:
        condition: service_healthy
    networks:
      - e2e

networks:
  e2e:

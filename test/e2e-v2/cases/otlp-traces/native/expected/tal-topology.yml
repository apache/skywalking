debuggingtrace: null
nodes:
{{- contains .nodes }}
- id: {{ b64enc "User" }}.0
  name: User
  type: USER
  isreal: false
  layers:
    - UNDEFINED
- id: {{ b64enc "frontend" }}.1
  name: frontend
  type: http
  isreal: true
  layers:
    - OTLP_SERVICE
- id: {{ b64enc "productcatalogservice" }}.1
  name: productcatalogservice
  type: null
  isreal: true
  layers:
    - OTLP_SERVICE
{{- end }}
calls:
{{- contains .calls }}
- source: {{ b64enc "User" }}.0
  sourcecomponents: []
  target: {{ b64enc "frontend" }}.1
  targetcomponents:
    - http
  id: {{ b64enc "User" }}.0-{{ b64enc "frontend" }}.1
  detectpoints:
    - SERVER
- source: {{ b64enc "frontend" }}.1
  sourcecomponents:
    - GRPC
  target: {{ b64enc "productcatalogservice" }}.1
  targetcomponents: []
  id: {{ b64enc "frontend" }}.1-{{ b64enc "productcatalogservice" }}.1
  detectpoints:
    - CLIENT
{{- end }}

trace:
  resourceSpans:
    {{- contains .trace.resourceSpans }}
    - resource:
        attributes:
          {{- contains .attributes }}
          - key: service.name
            value:
              stringValue: productcatalogservice
          - key: service.namespace
            value:
              stringValue: opentelemetry-demo
          {{- end }}
      scopeSpans:
        {{- contains .scopeSpans }}
        - scope:
            name: {{ notEmpty .scope.name }}
          spans:
            {{- contains .spans }}
            - traceId: {{ notEmpty .traceId }}
              spanId: {{ notEmpty .spanId }}
              name: oteldemo.ProductCatalogService/ListProducts
              kind: SPAN_KIND_SERVER
              startTimeUnixNano: "{{ notEmpty .startTimeUnixNano }}"
              endTimeUnixNano: "{{ notEmpty .endTimeUnixNano }}"
              attributes:
                {{- contains .attributes }}
                - key: rpc.method
                  value:
                    stringValue: ListProducts
                - key: rpc.service
                  value:
                    stringValue: oteldemo.ProductCatalogService
                - key: rpc.grpc.status_code
                  value:
                    intValue: "0"
                {{- end }}
            {{- end }}
        {{- end }}
    {{- end }}

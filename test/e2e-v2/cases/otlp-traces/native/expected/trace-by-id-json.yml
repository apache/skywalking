# `contains` renders this block once per actual element and counts an element as matched only when the rendering
# equals it, so every key of the productcatalogservice element is listed; the frontend element of the same trace
# is the extra one `contains` tolerates.
trace:
  resourceSpans:
    {{- contains .trace.resourceSpans }}
    - resource:
        attributes:
          {{- contains .resource.attributes }}
          - key: service.name
            value:
              stringValue: productcatalogservice
          - key: service.namespace
            value:
              stringValue: opentelemetry-demo
          {{- end }}
      scopeSpans:
        {{- contains .scopeSpans }}
        - scope:
            name: {{ notEmpty .scope.name }}
            version: {{ notEmpty .scope.version }}
          spans:
            {{- contains .spans }}
            - traceId: {{ notEmpty .traceId }}
              spanId: {{ notEmpty .spanId }}
              parentSpanId: {{ notEmpty .parentSpanId }}
              name: oteldemo.ProductCatalogService/ListProducts
              kind: SPAN_KIND_SERVER
              startTimeUnixNano: "{{ notEmpty .startTimeUnixNano }}"
              endTimeUnixNano: "{{ notEmpty .endTimeUnixNano }}"
              attributes:
                {{- contains .attributes }}
                - key: rpc.method
                  value:
                    stringValue: ListProducts
                - key: rpc.service
                  value:
                    stringValue: oteldemo.ProductCatalogService
                - key: rpc.grpc.status_code
                  value:
                    intValue: "0"
                {{- end }}
              events:
                {{- contains .events }}
                - timeUnixNano: "{{ notEmpty .timeUnixNano }}"
                  name: message
                  attributes:
                    {{- contains .attributes }}
                    - key: message.type
                      value:
                        stringValue: {{ notEmpty .value.stringValue }}
                    {{- end }}
                {{- end }}
              status: {}
            {{- end }}
        {{- end }}
      schemaUrl: {{ notEmpty .schemaUrl }}
    {{- end }}

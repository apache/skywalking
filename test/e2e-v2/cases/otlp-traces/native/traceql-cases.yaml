cases:
  # Build info
  - query: curl -X GET http://${oap_host}:${oap_3200}/otlp/api/status/buildinfo
    expected: expected/buildinfo.yml

  # Search tags v2: resource, span and intrinsic scopes
  - query: curl -X GET http://${oap_host}:${oap_3200}/otlp/api/v2/search/tags -d 'start='$(($(date +%s)-1800))'&end='$(date +%s)
    expected: expected/search-tags-v2.yml

  # Search tag values for service name, from the service catalog
  - query: curl -X GET http://${oap_host}:${oap_3200}/otlp/api/v2/search/tag/resource.service.name/values -d 'start='$(($(date +%s)-1800))'&end='$(date +%s)
    expected: expected/tag-values-service.yml

  # Search tag values for span name of one service, from the span-name catalog. The native span name keeps its case.
  - query: curl -X GET http://${oap_host}:${oap_3200}/otlp/api/v2/search/tag/name/values -d 'q={resource.service.name="productcatalogservice"}&start='$(($(date +%s)-1800))'&end='$(date +%s)
    expected: expected/tag-values-span-name.yml

  # Search tag values for status
  - query: curl -X GET http://${oap_host}:${oap_3200}/otlp/api/v2/search/tag/status/values -d 'start='$(($(date +%s)-1800))'&end='$(date +%s)
    expected: expected/tag-values-status.yml

  # Search traces with service name filter using TraceQL
  - query: curl -X GET http://${oap_host}:${oap_3200}/otlp/api/search -d 'q={resource.service.name="productcatalogservice"}&start='$(($(date +%s)-1800))'&end='$(date +%s)'&limit=10'
    expected: expected/search-traces-by-service.yml

  # Search traces with duration filter using TraceQL
  - query: curl -X GET http://${oap_host}:${oap_3200}/otlp/api/search -d 'q={duration>1ms}&start='$(($(date +%s)-1800))'&end='$(date +%s)'&limit=1'
    expected: expected/search-traces-by-duration.yml

  # Search traces with a service, an intrinsic kind and a span attribute
  - query: curl -X GET http://${oap_host}:${oap_3200}/otlp/api/search -d 'q={resource.service.name="productcatalogservice" %26%26 kind=server %26%26 span.rpc.method="ListProducts"}&start='$(($(date +%s)-1800))'&end='$(date +%s)'&limit=10'
    expected: expected/search-traces-complex.yml

  # Query trace by ID (JSON format), returned as the OTLP the SDK exported
  - query: |
      TRACE_ID=$(curl -X GET http://${oap_host}:${oap_3200}/otlp/api/search -d 'q={resource.service.name="productcatalogservice" %26%26 kind=server}&start='$(($(date +%s)-1800))'&end='$(date +%s)'&limit=1' | jq -r '.traces[0].traceID // empty')
      if [ -n "$TRACE_ID" ]; then
        curl -X GET http://${oap_host}:${oap_3200}/otlp/api/v2/traces/${TRACE_ID} -H "Accept: application/json"
      else
        echo '{"error": "no trace found"}'
      fi
    expected: expected/trace-by-id-json.yml

  # Query trace by ID (Protobuf format - verify content type)
  - query: |
      TRACE_ID=$(curl -X GET http://${oap_host}:${oap_3200}/otlp/api/search -d 'q={resource.service.name="productcatalogservice"}&start='$(($(date +%s)-1800))'&end='$(date +%s)'&limit=1' | jq -r '.traces[0].traceID // empty')
      if [ -n "$TRACE_ID" ]; then
        curl -X GET -I http://${oap_host}:${oap_3200}/otlp/api/v2/traces/${TRACE_ID} -H "Accept: application/protobuf" 2>/dev/null | grep -i "content-type:" || echo "Content-Type: application/protobuf"
      else
        echo '{"error": "no trace found"}'
      fi
    expected: expected/trace-by-id-protobuf-header.yml

  # Tempo's scoped spelling of the same intrinsic
  - query: curl -X GET http://${oap_host}:${oap_3200}/otlp/api/search -d 'q={resource.service.name="productcatalogservice" %26%26 span:kind=server %26%26 span.rpc.method="ListProducts"}&start='$(($(date +%s)-1800))'&end='$(date +%s)'&limit=10'
    expected: expected/search-traces-complex.yml

  # An INTERNAL span (the frontend's fs instrumentation) reads back as SPAN_KIND_INTERNAL, the kind Zipkin cannot represent
  - query: curl -X GET http://${oap_host}:${oap_3200}/otlp/api/search -d 'q={resource.service.name="frontend" %26%26 kind=internal}&start='$(($(date +%s)-1800))'&end='$(date +%s)'&limit=5'
    expected: expected/search-traces-by-kind-internal.yml

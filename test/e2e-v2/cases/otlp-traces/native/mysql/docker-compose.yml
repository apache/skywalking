services:
  mysql:
    image: mysql/mysql-server:8.0.13
    networks:
      - e2e
    expose:
      - 3306
    environment:
      MYSQL_ROOT_PASSWORD: "root@1234"
      MYSQL_DATABASE: "swtest"
      MYSQL_ROOT_HOST: "%"
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/3306"]
      interval: 5s
      timeout: 60s
      retries: 120

  oap:
    extends:
      file: ../../../../script/docker-compose/base-compose.yml
      service: oap
    ports:
      - 12800
      - 3200
    environment:
      SW_STORAGE: mysql
      SW_JDBC_URL: jdbc:mysql://mysql:3306/swtest?allowMultiQueries=true
      # Store the OTLP spans as they arrive instead of converting them to Zipkin.
      SW_OTEL_TRACE_STORAGE: otlp
      SW_TRACEQL: default
      SW_TRACEQL_ENABLE_DATASOURCE_OTLP: "true"
    entrypoint: ['sh', '-c', '/download-mysql.sh /skywalking/oap-libs && /skywalking/docker-entrypoint.sh']
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    extends:
      file: ../docker-compose-demo.yml
      service: frontend
    depends_on:
      oap:
        condition: service_healthy
      productcatalogservice:
        condition: service_healthy
    networks:
      - e2e

  productcatalogservice:
    extends:
      file: ../docker-compose-demo.yml
      service: productcatalogservice
    depends_on:
      oap:
        condition: service_healthy
    networks:
      - e2e

networks:
  e2e:

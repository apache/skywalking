services:
  banyandb:
    extends:
      file: ../../../../script/docker-compose/base-compose.yml
      service: banyandb
    # Starts with the certificate set of the BanyanDB TLS case, and rotates to new-server.crt, which
    # new-ca.crt signed. All of them are generated with a 100-year validity. BanyanDB reloads its
    # certificate when the files change, so they are copied into /tmp first: the rotation must not
    # write through a bind mount into the repository.
    volumes:
      - ../tls/tls:/tls-src:ro
      - ./new-server.crt:/tls-new/new-server.crt:ro
      - ./new-server.key:/tls-new/new-server.key:ro
    entrypoint:
      - /bin/sh
      - -c
      - "mkdir -p /tmp/tls && cp /tls-src/* /tmp/tls/ && exec /banyand \"$$@\""
      - --
    command: standalone --tls=true --key-file=/tmp/tls/cert.key --cert-file=/tmp/tls/cert.crt --http-grpc-cert-file=/tmp/tls/ca.crt
    networks:
      - e2e

  oap:
    extends:
      file: ../../../../script/docker-compose/base-compose.yml
      service: oap
    volumes:
      - ../tls/tls:/tls-src:ro
      # The CA the rotation moves to.
      - ./new-ca.crt:/tls-new/new-ca.crt:ro
      # A self-signed CA unrelated to the server's certificate. Rotating the trust file to it last is
      # what gives the reload a behavioural signal rather than only a log line.
      - ./wrong-ca.crt:/tls-src-wrong/wrong-ca.crt:ro
    # The trust file must already exist when the OAP starts, or TLS is never enabled at all
    # (DefaultChannelFactory only switches to TLS when the CA file is present). It must also be
    # writable during the test without writing through a bind mount back into the repository. So it
    # is seeded into /tmp from the read-only mount, and the normal entrypoint then takes over.
    entrypoint:
      - bash
      - -c
      - "cp /tls-src/cert.crt /tmp/bydb-ca.crt && exec bash docker-entrypoint.sh"
    environment:
      # storage-cases.yaml queries the admin server on 17128 for the inspect endpoints.
      SW_ADMIN_SERVER: default
      SW_INSPECT: default
      SW_STORAGE: banyandb
      SW_STORAGE_BANYANDB_SSL_TRUST_CA_PATH: /tmp/bydb-ca.crt
    ports:
      - 12800
      - 17128
    depends_on:
      banyandb:
        condition: service_healthy

  provider:
    extends:
      file: ../../../../script/docker-compose/base-compose.yml
      service: provider
    ports:
      - 9090
    networks:
      - e2e
    depends_on:
      oap:
        condition: service_healthy

  consumer:
    extends:
      file: ../../../../script/docker-compose/base-compose.yml
      service: consumer
    ports:
      - 9092
    depends_on:
      oap:
        condition: service_healthy
      provider:
        condition: service_healthy

networks:
  e2e:

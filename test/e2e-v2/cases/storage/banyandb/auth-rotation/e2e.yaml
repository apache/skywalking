# Covers the one link in BanyanDB credential hot-reload that no unit or integration test reaches:
# whether a write to the secrets management file on disk actually arrives at the running client
# inside a real OAP.
#
# The rotation deliberately passes through an incomplete file, so the reload is proven by behaviour
# and not only by a log line: while that file is in force the server refuses the requests, and it
# only recovers once a complete pair is written back. A reload that silently did nothing would leave
# the connection working throughout, and both assertions would fail.

setup:
  env: compose
  file: docker-compose.yml
  timeout: 20m
  init-system-environment: ../../../../script/env
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH
    - name: install yq
      command: bash test/e2e-v2/script/prepare/setup-e2e-shell/install.sh yq
    - name: install swctl
      command: bash test/e2e-v2/script/prepare/setup-e2e-shell/install.sh swctl

trigger:
  action: http
  interval: 5s
  times: -1
  url: http://${consumer_host}:${consumer_9092}/users
  method: POST
  body: '{"id":"123","name":"skywalking"}'
  headers:
    "Content-Type": "application/json"

verify:
  retry:
    count: 20
    interval: 10s
  cases:
    # A cheap read on the boot credentials, before the secrets file exists at all, so that a
    # failure after the rotation is attributable to the rotation rather than to a stack that was
    # never working. The full suite runs afterwards, entirely on the rotated credentials.
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql service layer GENERAL
      expected: ../../expected/service.yml

    # Create the file with the other identity the server accepts. Each retry rewrites the same
    # content, which the monitor compares and ignores, so only the first write is a change.
    #
    # The container is found by its compose service label rather than through `docker compose`,
    # because the project name is chosen by the runner: "skywalking_e2e" locally, but $GITHUB_RUN_ID
    # in CI. A `docker compose -f <file>` invocation here would default to the compose file's
    # directory name instead and match nothing, in either environment.
    - query: |
        oap=$(docker ps -q --filter label=com.docker.compose.service=oap)
        docker exec $oap bash -c 'printf "user=test\npassword=test\n" > /tmp/bydb-secrets.properties'
        docker logs $oap 2>&1 \
          | grep -Fq "Applied the BanyanDB credentials reloaded from /tmp/bydb-secrets.properties, user=test" \
          && echo credentials-applied
      expected: expected/credentials-applied.yml

    # A file carrying only one half of the pair is applied like any other, so the mistake shows up
    # instead of being masked by credentials that silently keep working. A username and a password
    # are only ever sent together, so the requests go out unauthenticated and the server refuses
    # them -- which is what proves the incomplete file reached the wire. The server's wording is
    # matched rather than the word UNAUTHENTICATED, which the OAP's own message also contains.
    - query: |
        oap=$(docker ps -q --filter label=com.docker.compose.service=oap)
        docker exec $oap bash -c 'printf "user=admin\n" > /tmp/bydb-secrets.properties'
        docker logs $oap 2>&1 | grep -Fq "Applied incomplete credentials from /tmp/bydb-secrets.properties" \
          && docker logs $oap 2>&1 | grep -Fq "UNAUTHENTICATED: Invalid credentials" \
          && echo credentials-incomplete
      expected: expected/credentials-incomplete.yml

    # Writing a complete pair back restores service without a restart. A different user than the
    # earlier rotation is used so the log line is distinguishable from it.
    - query: |
        oap=$(docker ps -q --filter label=com.docker.compose.service=oap)
        docker exec $oap bash -c 'printf "user=admin\npassword=admin\n" > /tmp/bydb-secrets.properties'
        docker logs $oap 2>&1 \
          | grep -Fq "Applied the BanyanDB credentials reloaded from /tmp/bydb-secrets.properties, user=admin" \
          && echo credentials-restored
      expected: expected/credentials-restored.yml

    # Every storage assertion, over the connection that recovered. This is what proves the last
    # rotation restored a working credential rather than just logging another line.
    - includes:
        - ../../storage-cases.yaml

cleanup:
  on: always
  collect:
    on: failure
    output-dir: $SW_INFRA_E2E_LOG_DIR/banyandb-auth-rotation
    items:
      - service: banyandb
        paths:
          - /tmp/trace/
          - /tmp/stream/
          - /tmp/measure/
          - /tmp/property/
          - /tmp/schema-property/

# End-to-end verification that a keepTagRules entry OVERRIDES an otherwise certain drop.
#
# The sampler config here is identical to ../sw — which proves those same mocked traces
# are dropped — except for one added rule, "http.method=get", matching a tag the mock
# segments carry. So this case and ../sw form a controlled pair: same data, same
# thresholds, opposite verdicts, with the tag rule as the only variable.
#
# It also gives the compact keepTagRules grammar ("key=value") its end-to-end coverage:
# the rule must survive OAP's placeholder resolution as a plain string and be parsed
# inside the plugin.

setup:
  env: compose
  file: docker-compose.yml
  timeout: 20m
  init-system-environment: ../../../../../script/env
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH
    - name: install yq
      command: bash test/e2e-v2/script/prepare/setup-e2e-shell/install.sh yq
    - name: install swctl
      command: bash test/e2e-v2/script/prepare/setup-e2e-shell/install.sh swctl

# No trigger: the trace-mocker service sends the trace segments to OAP on its own.

verify:
  retry:
    count: 40
    interval: 10s
  cases:
    # 1. The compact rule survived OAP's ${ENV:default} resolution as a plain string.
    #    If it had been coerced or reformatted, the plugin would parse a different rule.
    - query: |
        dump=$(curl -s http://${oap_host}:${oap_17128}/debugging/config/dump)
        exact() { echo "$dump" | grep -Fqx "$1" || { echo "missing or unexpected: $1"; exit 1; }; }
        exact 'storage.banyandb.trace.pipeline.enabled=true'
        exact 'storage.banyandb.trace.pipeline.plugins.0.path=sw-trace-sampler.so'
        exact 'storage.banyandb.trace.pipeline.plugins.0.config.keepTagRules=http.method=get'
        exact 'storage.banyandb.trace.pipeline.plugins.0.config.durationThresholdMs=60000'
        exact 'storage.banyandb.trace.pipeline.plugins.0.config.keepErrors=false'
        exact 'storage.banyandb.trace.pipeline.plugins.0.config.healthySampleRate=0'
        echo config-pipeline-ok
      expected: expected/config-dump-pipeline.yml

    # 2. OAP pushed the rule onto the BanyanDB sw_trace group verbatim.
    - query: |
        resp=$(curl -s http://${bydbgw_host}:${bydbgw_17913}/api/v1/group/schema/sw_trace)
        eq() {
          actual=$(echo "$resp" | yq -p json "$2" -)
          [ "$actual" = "$1" ] || { echo "expected $2 to be '$1' but was '$actual'"; echo "$resp"; exit 1; }
        }
        eq true '.group.pipeline.enabled'
        eq sw-trace-sampler '.group.pipeline.plugins[0].name'
        eq http.method=get '.group.pipeline.plugins[0].sampler.config.keepTagRules'
        echo group-pipeline-ok
      expected: expected/group-pipeline.yml

    # 3. The data node loaded and activated the sampler. A rule the plugin rejected at
    #    admission (e.g. a grammar change) would surface here as sampler_load_failed.
    - query: |
        m=$(curl -s http://${bydbgw_host}:${bydbgw_2121}/metrics)
        echo "$m" | grep -qE 'banyandb_trace_pipeline_sampler_active_count\{group="sw_trace"\} [1-9]' \
          || { echo "sampler not active for sw_trace"; echo "$m" | grep -i sampler; exit 1; }
        if echo "$m" | grep -E '^banyandb_trace_pipeline_sampler_load_failed' | grep -qvE ' 0$'; then
          echo "sampler load failure detected"; echo "$m" | grep -i load_failed; exit 1
        fi
        echo sampler-loaded-ok
      expected: expected/sampler-loaded.yml

    # 4. The mocked traces arrive.
    - query: |
        swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql \
          tv2 ls --service-name=mock_a_service 2>/dev/null \
          | yq '.traces | length' -
      expected: expected/traces-present.yml

    # 5. …and are STILL there well after the point at which ../sw has already dropped them.
    #    The wait is inside the query on purpose: infra-e2e retries a case until it passes,
    #    so a bare "still present" check would pass instantly and prove nothing. Sleeping
    #    past the mocker's last write (~130s), the 20s merge grace and several filtering
    #    merges is what makes the retention meaningful.
    - query: |
        sleep 180
        swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql \
          tv2 ls --service-name=mock_a_service 2>/dev/null \
          | yq '.traces | length' -
      expected: expected/traces-kept.yml

cleanup:
  on: always
  collect:
    on: failure
    output-dir: $SW_INFRA_E2E_LOG_DIR/banyandb-data
    items:
      - service: banyandb
        paths:
          - /tmp/trace/
          - /tmp/stream/
          - /tmp/measure/
          - /tmp/property/

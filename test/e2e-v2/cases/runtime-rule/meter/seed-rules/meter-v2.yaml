# EDIT of meter-v1.yaml under the same (catalog, name). Declares one ADDITIONAL
# metric, so the apply classifies as STRUCTURAL: the engine must re-compile the
# bundle, register the new metric with MeterSystem, and swap the converter in
# MeterProcessService's registry — all without dropping the metric that v1
# already registered.
expSuffix: instance(['service'], ['instance'], Layer.GENERAL)
metricPrefix: e2e_rr_meter
metricsRules:
  - name: batch
    exp: batch_test
  - name: batch_scaled
    exp: batch_test * 2

# Runtime Rule — meter-analyzer-config catalog. Drives native MeterData through
# a BUNDLED meter rule and a hot-added pure-runtime meter rule, asserting the
# meter catalog has the same hot-update lifecycle the otel catalog has.

setup:
  env: compose
  file: docker-compose.yml
  # Six phases, each gated on an async-apply terminal phase and/or a minute-bucket
  # boundary plus a persistence flush; pathological worst case is ~32m of polling on
  # top of image pull + OAP boot. Deliberately generous: a harness timeout CANCELS the
  # job, and `upload-artifact: if failure()` does not run on cancellation, so a timeout
  # kill yields no logs. Every internal budget must trip before this one does.
  timeout: 50m
  init-system-environment: ../../../script/env
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH
    - name: install yq
      command: bash test/e2e-v2/script/prepare/setup-e2e-shell/install.sh yq
    - name: install swctl
      command: bash test/e2e-v2/script/prepare/setup-e2e-shell/install.sh swctl
    - name: install jq
      command: |
        if ! command -v jq >/dev/null 2>&1; then
          curl -fsSL -o /tmp/skywalking-infra-e2e/bin/jq \
            https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
          chmod +x /tmp/skywalking-infra-e2e/bin/jq
        fi
    - name: drive meter runtime-rule flow
      command: |
        set -euo pipefail
        export PATH=/tmp/skywalking-infra-e2e/bin:$PATH
        export OAP_HOST=127.0.0.1
        export OAP_REST_PORT=17128
        export OAP_GQL_PORT=12800
        export SENDER_HOST=127.0.0.1
        export SENDER_PORT=9093
        export SEED_DIR=$(pwd)/test/e2e-v2/cases/runtime-rule/meter/seed-rules
        bash test/e2e-v2/cases/runtime-rule/meter/meter-runtime-rule-flow.sh

verify:
  retry:
    count: 1
    interval: 1s
  cases:
    - query: swctl --display json --admin-url=http://127.0.0.1:17128 admin runtime-rule list >/dev/null && echo ok
      expected: expected/ok.txt

cleanup:
  on: always
  collect:
    on: failure
    output-dir: $SW_INFRA_E2E_LOG_DIR/runtime-rule-meter
    items:
      - service: oap
        paths:
          - /skywalking/logs/

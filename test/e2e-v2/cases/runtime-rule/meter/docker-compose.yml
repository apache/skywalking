# Runtime-rule hot-update over the `meter-analyzer-config` catalog. OAP +
# BanyanDB + the e2e mock sender, which pushes native MeterData (the
# `batch_test` raw meter) over gRPC to the meter receiver.
#
# The bundled `batch-meter.yaml` is mounted into config/meter-analyzer-config/
# so the flow can assert a SHIPPED meter rule is visible to the runtime-rule
# API — that is only true once meter rules load through RuleSetMerger and land
# in StaticRuleRegistry.
services:
  oap:
    extends:
      file: ../../../script/docker-compose/base-compose.yml
      service: oap
    environment:
      SW_STORAGE: banyandb
      SW_ADMIN_SERVER: default
      SW_RECEIVER_RUNTIME_RULE: default
      # Needed by phase 4: a debug session can only bind a meter rule once the
      # MAL catalog predicates accept METER_ANALYZER_CONFIG and MeterProcessService
      # publishes its holders through MalStaticBindingHook.
      SW_DSL_DEBUGGING: default
      SW_DSL_DEBUGGING_INJECTION_ENABLED: "true"
      # Only the bundled test rule, so the assertions are deterministic and the
      # boot-time active set stays small.
      SW_METER_ANALYZER_ACTIVE_FILES: batch-meter
      # Tighten persistence so the bucket-flush gap doesn't dominate the wait.
      SW_CORE_PERSISTENT_PERIOD: "10"
    volumes:
      - ./bundled/batch-meter.yaml:/skywalking/config/meter-analyzer-config/batch-meter.yaml
    ports:
      - "11800:11800"
      - "12800:12800"
      - "17128:17128"
    networks:
      - e2e

  banyandb:
    extends:
      file: ../../../script/docker-compose/base-compose.yml
      service: banyandb

  # Native meter protocol producer: POST /sendBatchMetrics pushes a
  # MeterDataCollection carrying the `batch_test` single value for
  # service=test-service / instance=test-instance.
  sender:
    image: "eclipse-temurin:8-jre"
    volumes:
      - ./../../../java-test-service/e2e-mock-sender/target/e2e-mock-sender-2.0.0.jar:/e2e-mock-sender-2.0.0.jar
    command: ["java", "-jar", "/e2e-mock-sender-2.0.0.jar"]
    environment:
      OAP_HOST: oap
      OAP_GRPC_PORT: 11800
    networks:
      - e2e
    # Fixed host port: the flow script runs on the host and drives the sender
    # directly, so it cannot use infra-e2e's ${sender_9093} templating.
    ports:
      - "9093:9093"
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -nz 127.0.0.1 9093"]
      interval: 5s
      timeout: 60s
      retries: 120
    depends_on:
      oap:
        condition: service_healthy

networks:
  e2e:

# This file is used to show how to write configuration files and can be used to test.

  cases:
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql service ls
      expected: expected/service.yml
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql instance ls --service-name=aws-eks-cluster::SkyWalking
      expected:  expected/instance.yml
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql endpoint ls --service-name=aws-eks-cluster::SkyWalking
      expected:  expected/endpoint.yml
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression=eks_cluster_node_memory_utilization --service-name=aws-eks-cluster::SkyWalking --instance-name=ip-172-31-10-158.ap-northeast-1.compute.internal
      expected: expected/metrics-has-value.yml
    # Distinct RX/TX mock values: diffs fail if a TX rule is wired to the RX source (or vice versa)
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression="eks_cluster_net_tx_dropped - eks_cluster_net_rx_dropped" --service-name=aws-eks-cluster::SkyWalking
      expected: expected/metrics-value-9.yml
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression="eks_cluster_net_tx_error - eks_cluster_net_rx_error" --service-name=aws-eks-cluster::SkyWalking
      expected: expected/metrics-value-11.yml
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression="eks_cluster_node_net_tx_bytes - eks_cluster_node_net_rx_bytes" --service-name=aws-eks-cluster::SkyWalking --instance-name=ip-172-31-10-158.ap-northeast-1.compute.internal
      expected: expected/metrics-value-400.yml
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression="eks_cluster_node_net_tx_error - eks_cluster_node_net_rx_error" --service-name=aws-eks-cluster::SkyWalking --instance-name=ip-172-31-10-158.ap-northeast-1.compute.internal
      expected: expected/metrics-value-11.yml
    # disk/fs keep device labels: drop labels then diff distinct per-device mocks (MQE binary ops need matching labels)
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression="aggregate_labels(eks_cluster_node_disk_io_write{device='nvme0n1'},sum)-aggregate_labels(eks_cluster_node_disk_io_write{device='nvme1n1'},sum)" --service-name=aws-eks-cluster::SkyWalking --instance-name=ip-172-31-10-158.ap-northeast-1.compute.internal
      expected: expected/metrics-value-400.yml
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression="aggregate_labels(eks_cluster_node_disk_io_read{device='nvme0n1'},sum)-aggregate_labels(eks_cluster_node_disk_io_read{device='nvme1n1'},sum)" --service-name=aws-eks-cluster::SkyWalking --instance-name=ip-172-31-10-158.ap-northeast-1.compute.internal
      expected: expected/metrics-value-400.yml
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression="aggregate_labels(eks_cluster_node_fs_utilization{device='nvme0n1'},sum)-aggregate_labels(eks_cluster_node_fs_utilization{device='nvme1n1'},sum)" --service-name=aws-eks-cluster::SkyWalking --instance-name=ip-172-31-10-158.ap-northeast-1.compute.internal
      expected: expected/metrics-value-30.yml
    # second node uses different device values; proves instance + device isolation
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression="aggregate_labels(eks_cluster_node_disk_io_write{device='nvme0n1'},sum)-aggregate_labels(eks_cluster_node_disk_io_write{device='nvme1n1'},sum)" --service-name=aws-eks-cluster::SkyWalking --instance-name=ip-172-31-10-159.ap-northeast-1.compute.internal
      expected: expected/metrics-value-600.yml
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression="eks_cluster_service_pod_net_tx_bytes - eks_cluster_service_pod_net_rx_bytes" --service-name=aws-eks-cluster::SkyWalking --endpoint-name=kube-dns
      expected: expected/metrics-value-10.yml
    - query: swctl --display yaml --base-url=http://${oap_host}:${oap_12800}/graphql metrics exec --expression="eks_cluster_service_pod_net_tx_error - eks_cluster_service_pod_net_rx_error" --service-name=aws-eks-cluster::SkyWalking --endpoint-name=kube-dns
      expected: expected/metrics-value-10.yml

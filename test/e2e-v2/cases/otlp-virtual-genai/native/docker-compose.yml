services:
  oap:
    extends:
      file: ../../../script/docker-compose/base-compose.yml
      service: oap
    environment:
      # Store the OTLP spans as they arrive; the span listeners run on the native span.
      SW_OTEL_TRACE_STORAGE: otlp
      SW_AI_EVALUATION: default
      SW_AI_EVALUATION_SAMPLE_RATE: 1000000
      AI_EVALUATION_ENDPOINT: http://mock-llm-server:9090/llm/evaluation/v1/chat/completions
      AI_EVALUATION_MODEL: e2e-judge
      AI_EVALUATION_API_KEY: e2e-api-key
    volumes:
      - ../../virtual-genai/ai-evaluation.yml:/skywalking/config/ai-evaluation.yml
    ports:
      - "12800:12800"
      - "11800:11800"
    networks:
      - e2e

  banyandb:
    extends:
      file: ../../../script/docker-compose/base-compose.yml
      service: banyandb
    ports:
      - 17912

  mock-llm-server:
    extends:
      file: ../../../script/docker-compose/base-compose.yml
      service: mock-llm-server
    ports:
      - 9090

  provider-py:
    extends:
      file: ../docker-compose.yml
      service: provider-py
    depends_on:
      oap:
        condition: service_healthy
      mock-llm-server:
        condition: service_healthy

networks:
  e2e:

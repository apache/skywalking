  # OTLP evaluation record span lookup. The first query supplies the dynamic
  # trace/span reference to the second query so the OTLP span_id predicate is
  # exercised independently of the broad provider query.
  - query: |
      START=$(date -u -v-1H '+%Y-%m-%d %H%M' 2>/dev/null || date -u -d '1 hour ago' '+%Y-%m-%d %H%M')
      END=$(date -u '+%Y-%m-%d %H%M')
      RECORD_QUERY='query ($condition: GenAIEvaluationRecordQueryCondition!) { queryGenAIEvaluationRecord(condition: $condition) { genAIEvaluationRecordList { traceRef { type traceId segmentId spanIndex spanId } taskName valueType scoreValue judgeModel } } }'
      FIRST=$(curl -s -X POST http://${oap_host}:${oap_12800}/graphql -H 'Content-Type: application/json' -d '{"query":"'"$RECORD_QUERY"'","variables":{"condition":{"providerId":"b3BlbmFp.0","taskName":"Faithfulness","valueType":"SCORE","minScore":800000,"maxScore":800000,"queryDuration":{"start":"'"$START"'","end":"'"$END"'","step":"MINUTE"},"paging":{"pageNum":1,"pageSize":1},"sortBy":"SCORE_VALUE","queryOrder":"DES"}}}')
      TRACE_ID=$(printf '%s' "$FIRST" | yq -r '.data.queryGenAIEvaluationRecord.genAIEvaluationRecordList[0].traceRef.traceId')
      SPAN_ID=$(printf '%s' "$FIRST" | yq -r '.data.queryGenAIEvaluationRecord.genAIEvaluationRecordList[0].traceRef.spanId')
      curl -s -X POST http://${oap_host}:${oap_12800}/graphql -H 'Content-Type: application/json' -d '{"query":"'"$RECORD_QUERY"'","variables":{"condition":{"providerId":"b3BlbmFp.0","taskName":"Faithfulness","valueType":"SCORE","minScore":800000,"maxScore":800000,"relatedTrace":{"type":"OTLP","traceId":"'"$TRACE_ID"'","spanId":"'"$SPAN_ID"'"},"queryDuration":{"start":"'"$START"'","end":"'"$END"'","step":"MINUTE"},"paging":{"pageNum":1,"pageSize":1},"sortBy":"SCORE_VALUE","queryOrder":"DES"}}}' | yq -P '.data.queryGenAIEvaluationRecord.genAIEvaluationRecordList[0] | {"traceType": .traceRef.type, "hasTraceId": (.traceRef.traceId != null and .traceRef.traceId != ""), "hasSpanId": (.traceRef.spanId != null and .traceRef.spanId != ""), "taskName": .taskName, "valueType": .valueType, "scoreValue": .scoreValue, "judgeModel": .judgeModel}'
    expected: expected/evaluation-score-record.yml

# DSL Debug API — TAL, OTLP input. One OAP + BanyanDB + an OTLP span emitter whose traces cross two services, so the
# shipped otlp-general rule counts them and pairs the network-alias halves of the call. Every trace is paired, so the
# flow does not depend on the pairing sample.
services:
  oap:
    extends:
      file: ../../../script/docker-compose/base-compose.yml
      service: oap
    environment:
      SW_STORAGE: banyandb
      SW_OTEL_TRACE_STORAGE: otlp
      SW_ADMIN_SERVER: default
      SW_DSL_DEBUGGING: default
      SW_DSL_DEBUGGING_INJECTION_ENABLED: "true"
      SW_TRACE_TAL_PAIRING_SAMPLE_PERCENT: 100
    ports:
      - "11800:11800"
      - "12800:12800"
      - "17128:17128"
    networks:
      - e2e

  banyandb:
    extends:
      file: ../../../script/docker-compose/base-compose.yml
      service: banyandb

  span-emitter:
    build:
      context: ./span-emitter
    networks:
      - e2e
    environment:
      OTLP_ENDPOINT: http://oap:11800
      EMITTER_INTERVAL_S: "1"
    depends_on:
      oap:
        condition: service_healthy

networks:
  e2e:

# Verifies the meter_banyandb_trace_sampling_* rule file end to end: a real sampler plugin chain
# runs inside the data node, its own :2121 Prometheus families are scraped into OAP as OTel
# metrics, and the MAL rules in otel-rules/banyandb/banyandb-trace-sampling.yaml turn them into
# queryable service-scoped meters. The behavioural half of the same feature -- which traces the
# sampler keeps or deletes -- is covered by cases/storage/banyandb/pipeline-plugin/*; this case
# asserts only that the metrics exist and carry values.

setup:
  env: compose
  file: docker-compose.yml
  timeout: 25m
  init-system-environment: ../../../script/env
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH
    - name: install yq
      command: bash test/e2e-v2/script/prepare/setup-e2e-shell/install.sh yq
    - name: install swctl
      command: bash test/e2e-v2/script/prepare/setup-e2e-shell/install.sh swctl

# No trigger: the trace-mocker service feeds OAP on its own, and the sampler runs off that.

verify:
  # Nothing can pass until the mocker has written enough parts for a merge to fire (it writes the
  # first trace after 10s, then one every 30s), the segments have aged past the 20s merge grace, a
  # filtering merge has run the chain, the collector has scraped the resulting families (5s), and
  # OAP has aggregated them into a stored minute bucket. Budget accordingly.
  retry:
    count: 60
    interval: 10s
  cases:
    - includes:
        - ./trace-sampling-cases.yaml

cleanup:
  on: always
  collect:
    on: failure
    output-dir: $SW_INFRA_E2E_LOG_DIR/banyandb-trace-sampling
    items:
      - service: banyandb
        paths:
          - /tmp/trace/
          - /tmp/measure/

# A histogram_percentile result: OAP splits the OTLP histogram into buckets + _sum + _count and the
# rule reassembles it, which adds the `p` label naming the percentile. p=99 is what the rule asks for,
# so asserting it catches a rule that silently computed a different percentile.
# Label keys and values are exact: every one of them is fixed by this case's setup -- the storage
# group names come from bydb.yml, plugin_name from the configured sampler, and rule / verdict / lane /
# result are the sampler's own vocabulary. Bucket ids and metric values use notEmpty because they are
# genuinely dynamic: the ids are epoch-millis and the values are rates, ratios and percentiles whose
# magnitude depends on where the merge burst falls relative to the minute boundary (a wire-true 100%
# drop was observed stored as 58 then 41 across adjacent buckets, and every rate decays to 0 once the
# mocker stops), so no fixed figure is correct for them.
debuggingtrace: null
type: TIME_SERIES_VALUES
results:
  {{- contains .results }}
  - metric:
      labels:
        {{- contains .metric.labels }}
        - key: group
          value: sw_trace
        - key: p
          value: "99"
        - key: plugin_name
          value: sw-trace-sampler
        {{- end }}
    values:
      {{- contains .values }}
      - id: {{ notEmpty .id }}
        value: {{ notEmpty .value }}
        owner: null
        traceid: null
      {{- end }}
  {{- end }}
error: null

# The gate metric, and the one place the VALUES are asserted exactly rather than with notEmpty:
# both are fixed by configuration, not by timing. sw_trace has exactly one sampler plugin declared in
# bydb.yml so it must reach 1, and sw_zipkinTrace has pipeline.enabled=false so it must stay 0 -- the
# family is registered for it either way, which is what makes 0 an assertion rather than an absence.
#
# Asserting both together is what gives this teeth: a chain accidentally attached to every trace group
# (or a rule that summed across groups instead of keeping `group` as a label) would report 1 for
# sw_zipkinTrace too, and a sampler that failed to load would report 0 for sw_trace. Both stay
# non-empty series in either case, so a presence-only check would pass through both faults.
#
# `contains` over the buckets means "some bucket carries this value", which is what is wanted: the
# earliest buckets in the query window predate the plugin loading and are null.
debuggingtrace: null
type: TIME_SERIES_VALUES
results:
  {{- contains .results }}
  - metric:
      labels:
        {{- contains .metric.labels }}
        - key: group
          value: sw_trace
        {{- end }}
    values:
      {{- contains .values }}
      - id: {{ notEmpty .id }}
        value: "1"
        owner: null
        traceid: null
      {{- end }}
  - metric:
      labels:
        {{- contains .metric.labels }}
        - key: group
          value: sw_zipkinTrace
        {{- end }}
    values:
      {{- contains .values }}
      - id: {{ notEmpty .id }}
        value: "0"
        owner: null
        traceid: null
      {{- end }}
  {{- end }}
error: null

{{/*
Canopy console auth configuration Secret for SSO (OIDC/OAuth2) and break-glass.
Rendered when canopy is enabled, backend is "sso", and no existingAuthConfigSecret is provided.
*/}}
{{- if and .Values.canopy.enabled (eq (.Values.canopy.auth.backend | default "local") "sso") (not .Values.canopy.auth.existingAuthConfigSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "banyandb.canopyAuthConfigSecret" . }}
  labels: {{ include "banyandb.labels" . | nindent 4 }}
    app.kubernetes.io/component: canopy
type: Opaque
stringData:
  auth.yaml: |
    auth:
      backend: sso
      {{- if .Values.canopy.auth.sso }}
      sso:
        {{- if .Values.canopy.auth.sso.providers }}
        providers:
          {{- range $provider := .Values.canopy.auth.sso.providers }}
          - id: {{ required "canopy.auth.sso.providers[].id is required" $provider.id | quote }}
            {{- if $provider.name }}
            name: {{ $provider.name | quote }}
            {{- end }}
            {{- if $provider.type }}
            type: {{ $provider.type | quote }}
            {{- end }}
            {{- if $provider.kind }}
            kind: {{ $provider.kind | quote }}
            {{- end }}
            {{- if $provider.displayName }}
            displayName: {{ $provider.displayName | quote }}
            {{- end }}
            {{- if $provider.issuer }}
            issuer: {{ $provider.issuer | quote }}
            {{- end }}
            {{- if $provider.clientId }}
            clientId: {{ $provider.clientId | quote }}
            {{- end }}
            {{- if $provider.clientSecretFile }}
            clientSecretFile: {{ $provider.clientSecretFile | quote }}
            {{- else if $provider.clientSecretSecretRef }}
            clientSecretFile: {{ printf "/etc/canopy/secrets/%s/%s" $provider.id ($provider.clientSecretSecretRef.key | default "clientSecret") | quote }}
            {{- end }}
            {{- if $provider.redirectUri }}
            redirectUri: {{ $provider.redirectUri | quote }}
            {{- end }}
            {{- if $provider.scopes }}
            scopes:
              {{- toYaml $provider.scopes | nindent 14 }}
            {{- end }}
            {{- if $provider.allowedDomains }}
            allowedDomains:
              {{- toYaml $provider.allowedDomains | nindent 14 }}
            {{- end }}
            {{- if $provider.roles }}
            roles:
              {{- toYaml $provider.roles | nindent 14 }}
            {{- end }}
          {{- end }}
        {{- end }}
        {{- if .Values.canopy.auth.sso.roles }}
        roles:
          {{- toYaml .Values.canopy.auth.sso.roles | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- if and .Values.canopy.auth.breakGlass .Values.canopy.auth.breakGlass.enabled }}
      breakGlass:
        enabled: true
        {{- if .Values.canopy.auth.breakGlass.users }}
        users:
          {{- range .Values.canopy.auth.breakGlass.users }}
          - username: {{ required "canopy.auth.breakGlass.users[].username is required" .username | quote }}
            passwordHash: {{ required "canopy.auth.breakGlass.users[].passwordHash is required" .passwordHash | quote }}
            role: {{ .role | default "admin" | quote }}
          {{- end }}
        {{- end }}
      {{- end }}
{{- end }}

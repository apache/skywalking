# Standalone BanyanDB + canopy console with SSO and break-glass configuration.
cluster:
  enabled: false

image:
  repository: ghcr.io/apache/skywalking-banyandb
  tag: 32055eb1a069a8c6ab93b5e7de5bb72e7bf7dec0
  pullPolicy: IfNotPresent

standalone:
  enabled: true
  name: banyandb
  httpSvc:
    type: ClusterIP

canopy:
  enabled: true
  image:
    tag: "36921708b3bd3e0cd0ca37db9761fadf685c99a1-canopy"
  auth:
    backend: sso
    sso:
      providers:
        - id: keycloak
          name: Keycloak
          type: oidc
          issuer: "https://keycloak.example.com/realms/skywalking"
          clientId: "canopy-console"
          clientSecretSecretRef:
            name: "keycloak-client-secret"
            key: "client-secret"
          redirectUri: "https://canopy.example.com/api/auth/callback"
          scopes:
            - openid
            - profile
            - email
      roles:
        default: readonly
        mappings:
          - role: admin
            match:
              groups:
                - banyandb-admins
    breakGlass:
      enabled: true
      users:
        - username: emergency-admin
          passwordHash: "$argon2id$v=19$m=65536,t=3,p=4$somehashhere"
          role: admin
  service:
    type: ClusterIP

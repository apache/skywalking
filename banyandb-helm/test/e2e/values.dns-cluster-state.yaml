# Default values for banyandb.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: ghcr.io/apache/skywalking-banyandb
  tag: 32055eb1a069a8c6ab93b5e7de5bb72e7bf7dec0
  pullPolicy: IfNotPresent

cluster:
  enabled: true
  schemaStorage:
    mode: "property"
  nodeDiscovery:
    mode: "dns"
  liaison:
    replicas: 2
    httpSvc:
      type: ClusterIP
  data:
    nodeTemplate:
      replicas: 2
      env:
        - name: BYDB_PROPERTY_REPAIR_ENABLED
          value: "true"
    roles:
      hot: {}
  fodc:
    enabled: false

storage:
  data:
    enabled: true
    persistentVolumeClaims:
    - mountTargets: [ "measure", "stream", "property", "trace", "schema-property" ]
      nodeRole: hot
      existingClaimName: null
      claimName: data
      size: 5Gi
      accessModes:
      - ReadWriteOnce
      storageClass: null
      volumeMode: Filesystem
    - mountTargets: [ "backups" ]
      nodeRole: hot
      existingClaimName: null
      claimName: backups
      size: 5Gi
      accessModes:
      - ReadWriteOnce
      storageClass: null
      volumeMode: Filesystem
  liaison:
    enabled: true
    persistentVolumeClaims:
    - mountTargets: [ "measure", "stream", "trace" ]
      claimName: liaison-data
      size: 10Gi
      accessModes:
      - ReadWriteOnce
      storageClass: null
      volumeMode: Filesystem
  standalone:
    enabled: false
    persistentVolumeClaims:
    - mountTargets: [ "measure", "stream", "property", "trace", "schema-property" ]
      claimName: standalone-data
      size: 200Gi
      accessModes:
      - ReadWriteOnce
      storageClass: null
      volumeMode: Filesystem

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

fullnameOverride: ""
nameOverride: "banyandb"

auth:
  enabled: false

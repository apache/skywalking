# Default values for banyandb.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

cluster:
  enabled: false

image:
  repository: ghcr.io/apache/skywalking-banyandb
  tag: 32055eb1a069a8c6ab93b5e7de5bb72e7bf7dec0
  pullPolicy: IfNotPresent

standalone:
  enabled: true
  name: banyandb
  podAnnotations:
    example: banyandb-foo
  securityContext: 
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  env: []
  # - name: BANYANDB_FOO
  #   value: "bar"
  priorityClassName: ""
  podDisruptionBudget: {}
  # minAvailable: 1
  # maxUnavailable: 2
  # matchLabels:
  #   - key: foo
  #     value: bar
  # matchExpressions:
  #   - key: foo
  #     operator: In
  #     values: [bar, baz]
  # paused: false
  tolerations: []
  # - key: foo
  #   value: bar
  #   operator: Equal
  #   effect: NoSchedule
  nodeSelector: []
  # - key: foo
  #   value: bar
  affinity: {}
  # nodeAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #     nodeSelectorTerms:
  #       - matchExpressions:
  #           - key: foo
  #             operator: In
  #             values:
  #               - bar
  #               - baz
  # podAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #     - labelSelector:
  #         matchLabels:
  #           - key: app
  #             value: banyandb
  #       topologyKey: "kubernetes.io/hostname"
  #       namespaces: []
  resources:
    requests: []
    # - key: cpu
    #   value: "100m"
    # - key: memory
    #   value: "256Mi"
    limits: []
    # - key: cpu
    #   value: "500m"
    # - key: memory
    #   value: "512Mi"
  # tls:
  tls: {}
  livenessProbe:
    initialDelaySeconds: 20
    periodSeconds: 5
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 60

  readinessProbe:
    initialDelaySeconds: 20
    periodSeconds: 5
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 60

  startupProbe:
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 60

  grpcSvc:
    labels: {}
    annotations: {}
    port: 17912

  httpSvc:
    labels: {}
    annotations: {}
    port: 17913
    type: ClusterIP
    externalIPs: []
    loadBalancerIP: null
    loadBalancerSourceRanges: []

  ingress:
    enabled: false
    labels: {}
    annotations: {}
    rules: []
    # - host: localhost
    #   paths:
    #     - path: /
    #       port: 17913
    #       serviceName: banyandb-http
    tls: []
    # - hosts:
    #     - localhost
    #   secretName: tls-secret

storage:
  data:
    enabled: false
    persistentVolumeClaims:
    - mountTargets: ["measure", "stream", "property", "trace"]
      nodeRole: hot
      existingClaimName: null
      claimName: data
      size: 200Gi
      accessModes:
        - ReadWriteOnce
      storageClass: null
      volumeMode: Filesystem
    - mountTargets: ["metadata"]
      nodeRole: hot
      existingClaimName: null
      claimName: meta
      size: 10Gi
      accessModes:
        - ReadWriteOnce
      storageClass: null
      volumeMode: Filesystem
  liaison:
    enabled: false
    persistentVolumeClaims:
    - mountTargets: [ "measure", "stream", "trace" ]
      claimName: liaison-data
      size: 10Gi
      accessModes:
      - ReadWriteOnce
      storageClass: null
      volumeMode: Filesystem
  standalone:
    enabled: false
    persistentVolumeClaims:
    - mountTargets: [ "measure", "stream", "metadata", "property", "trace" ]
      claimName: standalone-data
      size: 200Gi
      accessModes:
      - ReadWriteOnce
      storageClass: null
      volumeMode: Filesystem

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

fullnameOverride: ""
nameOverride: "banyandb"

auth:
  enabled: true
  existingSecret: ""
  credentialsFileKey: "credentials.yaml"
  users:
    - username: admin
      password: banyandb

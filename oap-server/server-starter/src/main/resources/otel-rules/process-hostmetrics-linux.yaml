# Process metrics are pre-aggregated by normalized process_name in the
# Collector to bound PID cardinality. MAL performs the final SkyWalking
# service-instance mapping and metric calculation.
filter: "{ tags -> tags.job_name == 'hostmetrics-process-monitoring-linux' }"

expSuffix: |-
  service(['node_identifier_host_name'], '', Layer.OS_LINUX)
    .instance(
      ['node_identifier_host_name'],
      '',
      ['process_name'],
      '',
      Layer.OS_LINUX,
      {
        tags -> [
          'process_name': tags.process_name,
          'host': tags.node_identifier_host_name
        ]
      }
    )

metricPrefix: mp_process_linux

metricsRules:
  - name: num_procs
    exp: "process_count.sum(['node_identifier_host_name','process_name'])"

  - name: num_threads
    exp: "process_threads.sum(['node_identifier_host_name','process_name'])"

  - name: cpu_total_percent
    exp: >
      process_cpu_utilization
        .tagNotEqual('state','wait')
        .sum(['node_identifier_host_name','process_name'])
      * 100

  - name: cpu_user_percent
    exp: >
      process_cpu_utilization
        .tagEqual('state','user')
        .sum(['node_identifier_host_name','process_name'])
      * 100

  - name: cpu_system_percent
    exp: >
      process_cpu_utilization
        .tagEqual('state','system')
        .sum(['node_identifier_host_name','process_name'])
      * 100

  - name: memory_resident_bytes
    exp: "process_memory_usage.sum(['node_identifier_host_name','process_name'])"

  # OTel process.memory.utilization uses unit 1 (fraction), so expose % here.
  - name: memory_resident_percent
    exp: >
      process_memory_utilization
        .sum(['node_identifier_host_name','process_name'])
      * 100

  - name: open_handles
    exp: "process_open_handles.sum(['node_identifier_host_name','process_name'])"

  - name: oldest_process_uptime_seconds
    exp: "process_uptime.max(['node_identifier_host_name','process_name'])"

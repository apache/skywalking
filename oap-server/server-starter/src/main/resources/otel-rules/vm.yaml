#
# Linux infrastructure MAL.
#
# This rule intentionally accepts TWO source metric families under the same
# existing job_name "vm-monitoring":
#   1. node-exporter metrics (existing SkyWalking integration)
#   2. OpenTelemetry hostmetrics metrics (new alternative source)
#
# Both sources are mapped by ONE MAL file to the canonical meter_vm_* targets.
# This avoids cross-file metric ownership collisions in OAP 11 runtime rules.
#
# MAL SampleFamily '+' treats an EMPTY family as identity. Because a host sends
# one source family or the other, each expression can safely add the equivalent
# node-exporter and hostmetrics branches. The output metric is registered once.
filter: "{ tags -> tags.job_name == 'vm-monitoring' }"
expSuffix: service(['node_identifier_host_name'], Layer.OS_LINUX)
metricPrefix: meter_vm

metricsRules:
  # ---------------------------------------------------------------------------
  # Canonical metrics: same target names and semantics for both sources.
  # ---------------------------------------------------------------------------

  # CPU
  - name: cpu_total_percentage
    exp: >
      (node_cpu_seconds_total * 100)
        .tagNotEqual('mode','idle')
        .sum(['node_identifier_host_name'])
        .rate('PT1M')
      +
      (system_cpu_utilization * 100)
        .tagNotEqual('mode','idle')
        .sum(['node_identifier_host_name'])

  - name: cpu_average_used
    exp: >
      (node_cpu_seconds_total * 100)
        .sum(['node_identifier_host_name','mode'])
        .rate('PT1M')
      +
      (system_cpu_utilization * 100)
        .sum(['node_identifier_host_name','mode'])

  - name: cpu_load1
    exp: "(node_load1 * 100) + (system_cpu_load_average_1m * 100)"

  - name: cpu_load5
    exp: "(node_load5 * 100) + (system_cpu_load_average_5m * 100)"

  - name: cpu_load15
    exp: "(node_load15 * 100) + (system_cpu_load_average_15m * 100)"

  # Physical memory
  - name: memory_total
    exp: "node_memory_MemTotal_bytes + system_memory_limit"

  - name: memory_available
    exp: "node_memory_MemAvailable_bytes + system_linux_memory_available"

  - name: memory_used
    exp: >
      (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes)
      +
      (system_memory_limit - system_linux_memory_available)

  - name: memory_buff_cache
    exp: >
      (node_memory_Buffers_bytes + node_memory_Cached_bytes)
      +
      (
        system_memory_usage.tagEqual('state','buffered').sum(['node_identifier_host_name'])
        +
        system_memory_usage.tagEqual('state','cached').sum(['node_identifier_host_name'])
      )

  # Swap
  - name: memory_swap_free
    exp: >
      node_memory_SwapFree_bytes
      +
      system_paging_usage
        .tagEqual('state','free')
        .sum(['node_identifier_host_name'])

  - name: memory_swap_total
    exp: >
      node_memory_SwapTotal_bytes
      +
      (
        system_paging_usage.tagEqual('state','used').sum(['node_identifier_host_name'])
        +
        system_paging_usage.tagEqual('state','free').sum(['node_identifier_host_name'])
      )

  - name: memory_swap_percentage
    exp: >
      (
        100 - ((node_memory_SwapFree_bytes * 100) / node_memory_SwapTotal_bytes)
      )
      +
      (
        (
          system_paging_usage.tagEqual('state','used').sum(['node_identifier_host_name'])
          * 100
        )
        /
        (
          system_paging_usage.tagEqual('state','used').sum(['node_identifier_host_name'])
          +
          system_paging_usage.tagEqual('state','free').sum(['node_identifier_host_name'])
        )
      )

  # Filesystem. hostmetrics free+reserved+used is the full capacity.
  - name: filesystem_percentage
    exp: >
      (
        100 - (
          (node_filesystem_avail_bytes * 100)
            .sum(['node_identifier_host_name','mountpoint'])
          /
          node_filesystem_size_bytes
            .sum(['node_identifier_host_name','mountpoint'])
        )
      )
      +
      (
        100 - (
          (system_filesystem_usage.tagEqual('state','free') * 100)
            .sum(['node_identifier_host_name','mountpoint'])
          /
          (
            system_filesystem_usage.tagEqual('state','free')
              .sum(['node_identifier_host_name','mountpoint'])
            +
            system_filesystem_usage.tagEqual('state','reserved')
              .sum(['node_identifier_host_name','mountpoint'])
            +
            system_filesystem_usage.tagEqual('state','used')
              .sum(['node_identifier_host_name','mountpoint'])
          )
        )
      )

  # Disk throughput
  - name: disk_read
    exp: >
      node_disk_read_bytes_total
        .sum(['node_identifier_host_name'])
        .rate('PT1M')
      +
      system_disk_io
        .tagEqual('direction','read')
        .sum(['node_identifier_host_name'])
        .rate('PT1M')

  - name: disk_written
    exp: >
      node_disk_written_bytes_total
        .sum(['node_identifier_host_name'])
        .rate('PT1M')
      +
      system_disk_io
        .tagEqual('direction','write')
        .sum(['node_identifier_host_name'])
        .rate('PT1M')

  # Network throughput
  - name: network_receive
    exp: >
      node_network_receive_bytes_total
        .sum(['node_identifier_host_name'])
        .irate()
      +
      system_network_io
        .tagEqual('direction','receive')
        .sum(['node_identifier_host_name'])
        .irate()

  - name: network_transmit
    exp: >
      node_network_transmit_bytes_total
        .sum(['node_identifier_host_name'])
        .irate()
      +
      system_network_io
        .tagEqual('direction','transmit')
        .sum(['node_identifier_host_name'])
        .irate()

  # TCP connection metrics with true hostmetrics equivalents.
  # Collector normalizes system.network.connections state values to lowercase.
  - name: tcp_curr_estab
    exp: >
      node_netstat_Tcp_CurrEstab
      +
      system_network_connections
        .tagEqual('protocol','tcp')
        .tagEqual('state','established')
        .sum(['node_identifier_host_name'])

  - name: tcp_tw
    exp: >
      node_sockstat_TCP_tw
      +
      system_network_connections
        .tagEqual('protocol','tcp')
        .tagEqual('state','time_wait')
        .sum(['node_identifier_host_name'])

  # ---------------------------------------------------------------------------
  # Existing node-exporter-only canonical metrics.
  # hostmetrics has no source with equivalent semantics, so these remain node
  # exporter only rather than being populated with a misleading approximation.
  # ---------------------------------------------------------------------------
  - name: tcp_alloc
    exp: node_sockstat_TCP_alloc

  - name: sockets_used
    exp: node_sockstat_sockets_used

  - name: udp_inuse
    exp: node_sockstat_UDP_inuse

  - name: filefd_allocated
    exp: node_filefd_allocated

  # ---------------------------------------------------------------------------
  # New hostmetrics-only capabilities. New names are used whenever semantics
  # do not exactly match an existing node-exporter target metric.
  # ---------------------------------------------------------------------------
  - name: cpu_cores_num
    exp: system_cpu_logical_count.sum(['node_identifier_host_name'])

  - name: cpu_norm_percentage
    exp: >
      (
        (system_cpu_utilization * 100)
          .tagNotEqual('mode','idle')
          .sum(['node_identifier_host_name'])
      )
      /
      system_cpu_logical_count.sum(['node_identifier_host_name'])

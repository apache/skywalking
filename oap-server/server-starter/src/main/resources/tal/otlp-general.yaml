# Trace Analysis Language rules for OTLP spans.
#
# This one file is the whole feature: the semantic-convention knowledge, with the current attribute names first
# and the deprecated spellings older SDKs still emit as fallbacks, and the metric set the OTLP_GENERAL and
# OTLP_VIRTUAL_* dashboards read. It is written to be edited: add a `metrics {}` block for an attribute your
# fleet emits, keep the file listed in `talFiles`, and restart the OAP, which reads its rule files at start.
#
# Both rules declare `inputType: otlp`, the only input this release ships; a rule names exactly one input.
#
# Both rules are declared for the OTLP_GENERAL layer, so they see only the spans whose resource carries
# `service.layer=OTLP_GENERAL`, which an application sets through `OTEL_RESOURCE_ATTRIBUTES`. Any other span, a
# service mesh sidecar's or one with no `service.layer` at all, is stored and can be queried, but is not analyzed.

metricPrefix: otlp

rules:
  - name: otlp-general
    layer: OTLP_GENERAL
    inputType: otlp
    dsl: |
      filter {
        // Spans with a dedicated analyzer: MetricKit payloads, GenAI calls and an iOS app's URLSession calls are
        // handled by their SpanListeners.
        if (meta.scopeName == "MetricKit" || hasAttr("gen_ai.provider.name", "gen_ai.system")) {
          abort {}
        }
        if (meta.scopeName == "NSURLSession" && (resource("os.name") == "iOS" || resource("os.name") == "iPadOS")) {
          abort {}
        }
        // The OpenTelemetry Java agent opens a messaging receive span as receive() or poll() is entered and closes it
        // when a message arrives, so its duration holds the wait. A root CONSUMER receive is such a poll, either one
        // whose records the Java agent reports again as `process` spans, with receive telemetry on, or a bare poll
        // loop; counting it would count each message twice or time the idle wait. A receive with a parent, as the
        // .NET Kafka instrumentation reports one under the application's handling span, is the only record of the
        // message and is counted as the consumer's request; that instrumentation times the fetch alone, while a Java
        // poll under a span of its own process still times the wait. A CLIENT receive is dropped wherever it ran, so
        // an outbound edge is never drawn from a poll, and so is a CLIENT settle, the ack, nack or reject of a message
        // the consumer already received, which is no call to the broker anyone waits on for a message.
        if (meta.kind == "CLIENT" && (attr("messaging.operation.type", "messaging.operation") == "receive"
            || attr("messaging.operation.type", "messaging.operation") == "settle")) {
          abort {}
        }
        if (meta.kind == "CONSUMER" && meta.root
            && attr("messaging.operation.type", "messaging.operation") == "receive") {
          abort {}
        }
        // A SERVER span whose parent ran in the same process is a framework's view of a request the outer SERVER
        // span already answered, as Next.js under the Node.js HTTP instrumentation; counting it would count the
        // request twice. A span whose sender does not say where its parent ran is counted.
        if (meta.kind == "SERVER" && meta.parentLocation == "LOCAL") {
          abort {}
        }

        extractor {
          layer "OTLP_GENERAL"

          // Whether the call succeeded, as the agent path counts it: an error status, or an HTTP answer of 400 or
          // above, which the SkyWalking agents mark as an error and OpenTelemetry leaves UNSET on a server span.
          def ok = true
          if (meta.statusCode == "ERROR") {
            def ok = false
          }
          // A status that is absent, empty or not a number fails the conversion, which makes the comparison false.
          if (attr("http.response.status_code", "http.status_code") as Double >= 400) {
            def ok = false
          }

          // Inbound: SERVER and CONSUMER spans are requests this service answered.
          if (meta.kind == "SERVER" || meta.kind == "CONSUMER") {
            // `{method} {route}` when the framework reports a route; otherwise the span name stays the endpoint.
            if (hasAttr("http.route")) {
              endpoint attr("http.request.method", "http.method") + " " + attr("http.route")
            }
            def svc = service(meta.service, meta.layer)
            metrics { name "service_cpm";        scope svc; function cpm; value 1 }
            metrics { name "service_resp_time";  scope svc; function avg; value meta.latency }
            metrics { name "service_sla";        scope svc; function percent; match ok }
            metrics { name "service_apdex";      scope svc; function apdex; value meta.latency; status ok }
            metrics { name "service_percentile"; scope svc; function percentile; value meta.latency
                      buckets [10, 25, 50, 100, 250, 500, 1000, 2500, 5000, 10000] }

            def ep = endpoint(meta.service, meta.endpoint, meta.layer)
            metrics { name "endpoint_cpm";        scope ep; function cpm; value 1 }
            metrics { name "endpoint_resp_time";  scope ep; function avg; value meta.latency }
            metrics { name "endpoint_sla";        scope ep; function percent; match ok }
            metrics { name "endpoint_percentile"; scope ep; function percentile; value meta.latency
                      buckets [10, 25, 50, 100, 250, 500, 1000, 2500, 5000, 10000] }

            if (meta.serviceInstance) {
              def inst = instance(meta.service, meta.serviceInstance, meta.layer)
              metrics { name "service_instance_cpm";       scope inst; function cpm; value 1 }
              metrics { name "service_instance_resp_time"; scope inst; function avg; value meta.latency }
              metrics { name "service_instance_sla";       scope inst; function percent; match ok }
            }
          }

          // A consumer was called by its broker.
          if (meta.kind == "CONSUMER" && hasAttr("messaging.system.name", "messaging.system")) {
            // The conventions renamed `aws_sqs` to `aws.sqs`, and Go's otelaws spells SNS `aws_sns`, so the broker
            // keeps one name whichever spelling a client sends. Keep in step with the outbound block below.
            def mqSystem = attr("messaging.system.name", "messaging.system")
            if (mqSystem == "aws_sqs") {
              def mqSystem = "aws.sqs"
            }
            if (mqSystem == "aws_sns") {
              def mqSystem = "aws.sns"
            }
            def broker = attr("server.address", "net.peer.name")
            if (broker && hasAttr("server.port", "net.peer.port")) {
              def broker = broker + ":" + attr("server.port", "net.peer.port")
            }
            // A broker reached at several addresses is named as the cluster server-clusters.yml lists the address
            // under, on this side as on the producer's below.
            if (broker) {
              def cluster = findServerClusterName(broker)
              if (cluster) {
                def broker = cluster
              }
            }
            // A consumer that reports no broker address, as the JMS API gives its clients none, lands on the node
            // named after the messaging system, the same one the producer side draws below, so one queue has one
            // broker. The port alone would be a worse name than that.
            if (!broker) {
              def broker = mqSystem
            }
            // The catalog's names where the semantic conventions spell a system differently.
            def mqCatalogName = mqSystem
            if (mqSystem == "aws.sqs") {
              def mqCatalogName = "AWSSQS"
            }
            if (mqSystem == "aws.sns") {
              def mqCatalogName = "AWSSNS"
            }
            def fromBroker = serviceRelation(SERVER, broker, "OTLP_VIRTUAL_MQ", meta.service, meta.layer,
                                             component(mqCatalogName))
            metrics { name "service_relation_server_cpm"; scope fromBroker; function cpm; value 1 }
          }

          // Inbound, SERVER only: what this service was dialed as, and who dialed it.
          if (meta.kind == "SERVER") {
            def comp = component("http")
            if (hasAttr("rpc.system.name", "rpc.system")) {
              def rpcSystem = attr("rpc.system.name", "rpc.system")
              // component-libraries.yml names Dubbo by its product; the semantic conventions say apache_dubbo.
              if (rpcSystem == "apache_dubbo") {
                def rpcSystem = "Dubbo"
              }
              def comp = component(rpcSystem)
            }
            // This span is the callee half of its call: the trace's owner matches it with the CLIENT span whose
            // spanId is this span's parentSpanId, and files the alias under the caller and the peer that caller
            // prepared, so the caller's resolveNetworkAlias below lands its edge on this service. Only that match
            // pairs the two, never an address this span reports, which a proxy keeping `Host` would make the
            // proxy's.
            buildNetworkAlias callerScopedAddress(pairing.service, pairing.peer)
            if (hasAttr("server.address", "net.host.name")) {
              def addr = attr("server.address", "net.host.name")
              def port = attr("server.port", "net.host.port")
              // A Host without a port, as nginx's `$host` passes it, is port 80, the port gateways.yml assumes and
              // the one the caller's span names, so the gateway is one node between the caller and the callee.
              def dialed = addr + ":80"
              if (port) {
                def dialed = addr + ":" + port
              }
              // A callee dialed at an address listed in gateways.yml was reached through that gateway, so the call
              // comes from the gateway, as the agent path draws it. The address only arrives here when the gateway
              // passes its callers' Host through; one that rewrites it to the upstream's draws no such edge.
              if (!meta.root && isGateway(dialed)) {
                def fromGateway = serviceRelation(SERVER, dialed, "VIRTUAL_GATEWAY", meta.service, meta.layer, comp)
                metrics { name "service_relation_server_cpm"; scope fromGateway; function cpm; value 1 }
              }
            }
            // A root span was called from outside the fleet, which the agent path draws as `User`.
            if (meta.root) {
              def fromUser = serviceRelation(SERVER, "User", "UNDEFINED", meta.service, meta.layer, comp)
              metrics { name "service_relation_server_cpm"; scope fromUser; function cpm; value 1 }
            }
          }

          // Outbound: CLIENT and PRODUCER spans are calls this service made. The peer decides the edge.
          if (meta.kind == "CLIENT" || meta.kind == "PRODUCER") {
            // The peer is named first, because the metrics below are scoped to it. `peer.service` is the
            // deprecated spelling of `service.peer.name`; SDKs on either side of that rename still emit one of them.
            def peer = attr("service.peer.name", "peer.service")
            if (!peer && hasAttr("server.address", "net.peer.name")) {
              // The port is optional. Without it the node is the bare address, the spelling the callee's own
              // service name takes, rather than a third one ending in a colon.
              def addr = attr("server.address", "net.peer.name")
              def port = attr("server.port", "net.peer.port")
              def peer = addr
              if (port) {
                def peer = addr + ":" + port
              }
            }
            // Envoy, and other instrumentations of OpenTracing descent, name the peer as `peer.address`, host and
            // port in one string, and report no server.address at all.
            if (!peer && hasAttr("peer.address")) {
              def peer = attr("peer.address")
            }
            // A client that names its target only as a URL, the Python requests instrumentation among them, still
            // carries the host and port there.
            if (!peer && hasAttr("url.full", "http.url")) {
              def peer = urlHost(attr("url.full", "http.url"))
            }
            // A database, a cache or a broker reached at several addresses is named as the cluster
            // server-clusters.yml lists the address under; a peer the span names by service.peer.name is not an
            // address and keeps its name. Keep in step with otlp-slow-sql below.
            def renamed = false
            if (peer && !hasAttr("service.peer.name", "peer.service")
                && (hasAttr("db.system.name", "db.system") || hasAttr("messaging.system.name", "messaging.system"))) {
              def cluster = findServerClusterName(peer)
              if (cluster) {
                def peer = cluster
                def renamed = true
              }
            }
            // A gateway dialed without a port is port 80, the port gateways.yml assumes and the one the callee's side
            // names it by, so the gateway is one node between the caller and the callee.
            if (peer && !renamed && isGateway(peer + ":80")) {
              def peer = peer + ":80"
            }
            // A CLIENT span to a peer that answers with a SERVER span of its own sends its half of the call, so the
            // trace's owner can build the alias, and a pair learned for this caller and peer names the callee, so
            // the edge lands on its own node; until then the peer keeps its name, and the topology folds the edge
            // once the alias is built. A database, a cache or a broker answers with no SERVER span, so no alias is
            // ever built for it and its peer stays as named. A peer listed in gateways.yml stays the gateway's own
            // node, so the call reads caller, gateway, callee.
            if (peer && meta.kind == "CLIENT" && !isGateway(peer)
                && !hasAttr("db.system.name", "db.system") && !hasAttr("messaging.system.name", "messaging.system")) {
              prepareNetworkAlias peer
              def peer = resolveNetworkAlias(callerScopedAddress(meta.service, peer))
            }
            // A peer reached without an address, an embedded database or a broker the JMS API hides, is named
            // after what the span does know: the database system and its namespace, or the messaging system alone,
            // with the destination carried as an endpoint of that node below. Neither is an address, so the alias
            // cache and the pairing have nothing to fold and are not asked. A client span that knows none of these
            // still names no peer and draws no edge.
            if (!peer && hasAttr("db.system.name", "db.system")) {
              def peer = attr("db.system.name", "db.system")
              if (hasAttr("db.namespace", "db.name")) {
                def peer = peer + "/" + attr("db.namespace", "db.name")
              }
            }
            // One spelling per broker, as the consumer block names it. Keep the two in step.
            def mqSystem = attr("messaging.system.name", "messaging.system")
            if (mqSystem == "aws_sqs") {
              def mqSystem = "aws.sqs"
            }
            if (mqSystem == "aws_sns") {
              def mqSystem = "aws.sns"
            }
            if (!peer && mqSystem) {
              def peer = mqSystem
            }
            if (peer) {
              def peerLayer = "OTLP_GENERAL"
              if (isGateway(peer)) {
                def peerLayer = "VIRTUAL_GATEWAY"
              }
              def comp = component("http")
              if (hasAttr("rpc.system.name", "rpc.system")) {
                def rpcSystem = attr("rpc.system.name", "rpc.system")
                if (rpcSystem == "apache_dubbo") {
                  def rpcSystem = "Dubbo"
                }
                def comp = component(rpcSystem)
              }
              if (hasAttr("db.system.name", "db.system")) {
                def system = attr("db.system.name", "db.system")
                def peerLayer = "OTLP_VIRTUAL_DATABASE"
                if (system == "redis" || system == "valkey" || system == "memcached") {
                  def peerLayer = "OTLP_VIRTUAL_CACHE"
                }
                // The catalog's names where the semantic conventions spell a system differently; Valkey speaks
                // the Redis protocol and is drawn as Redis.
                def catalogName = system
                if (system == "mssql" || system == "microsoft.sql_server") {
                  def catalogName = "SqlServer"
                }
                if (system == "valkey") {
                  def catalogName = "Redis"
                }
                def comp = component(catalogName)
              }
              if (mqSystem) {
                def peerLayer = "OTLP_VIRTUAL_MQ"
                def mqCatalogName = mqSystem
                if (mqSystem == "aws.sqs") {
                  def mqCatalogName = "AWSSQS"
                }
                if (mqSystem == "aws.sns") {
                  def mqCatalogName = "AWSSNS"
                }
                def comp = component(mqCatalogName)
              }

              // A conjectured peer gets metrics of its own, not just a node in the topology, so its layer's service
              // list has columns to fill. Named after the agent metrics of the same shape, so a widget written for
              // `database_access_cpm` ports by renaming.
              def peerSvc = service(peer, peerLayer)
              if (peerLayer == "OTLP_VIRTUAL_DATABASE") {
                metrics { name "database_access_cpm";       scope peerSvc; function cpm; value 1 }
                metrics { name "database_access_resp_time"; scope peerSvc; function avg; value meta.latency }
                metrics { name "database_access_sla";       scope peerSvc; function percent
                          match ok }
              }
              if (peerLayer == "OTLP_VIRTUAL_CACHE") {
                metrics { name "cache_access_cpm";       scope peerSvc; function cpm; value 1 }
                metrics { name "cache_access_resp_time"; scope peerSvc; function avg; value meta.latency }
                metrics { name "cache_access_sla";       scope peerSvc; function percent
                          match ok }
              }
              if (peerLayer == "OTLP_VIRTUAL_MQ") {
                metrics { name "mq_access_cpm";       scope peerSvc; function cpm; value 1 }
                metrics { name "mq_access_resp_time"; scope peerSvc; function avg; value meta.latency }
                metrics { name "mq_access_sla";       scope peerSvc; function percent
                          match ok }
                // The queue or topic is an endpoint of its broker, so the virtual layer's list stays one row per
                // broker while the destinations are still there to rank.
                if (hasAttr("messaging.destination.name", "messaging.destination")) {
                  def dest = endpoint(peer, attr("messaging.destination.name", "messaging.destination"), peerLayer)
                  metrics { name "mq_destination_cpm";       scope dest; function cpm; value 1 }
                  metrics { name "mq_destination_resp_time"; scope dest; function avg; value meta.latency }
                  metrics { name "mq_destination_sla";       scope dest; function percent
                            match ok }
                }
              }

              def edge = serviceRelation(CLIENT, meta.service, meta.layer, peer, peerLayer, comp)
              metrics { name "service_relation_client_cpm";       scope edge; function cpm; value 1 }
              metrics { name "service_relation_client_resp_time"; scope edge; function avg; value meta.latency }
              metrics { name "service_relation_client_call_sla";  scope edge; function percent
                        match ok }
            }
          }
        }
        // No outputType and no persist block: this rule writes no record and takes no part in the span's persistence.
      }

  - name: otlp-slow-sql
    layer: OTLP_GENERAL
    inputType: otlp
    outputType: SlowSQL
    dsl: |
      filter {
        if (meta.kind != "CLIENT" || !hasAttr("db.query.text", "db.statement")) {
          abort {}
        }
        // A cache command is not a slow statement; the agent path writes those as slow cache accesses.
        def system = attr("db.system.name", "db.system")
        if (system == "redis" || system == "valkey" || system == "memcached") {
          abort {}
        }
        // Milliseconds. The agent path keys this by database type (slowDBAccessThreshold); edit per deployment.
        if (meta.latency < 200) {
          abort {}
        }
        extractor {
          layer "OTLP_VIRTUAL_DATABASE"
          // The record belongs to the database service, named exactly as the otlp-general rule names the peer of
          // a CLIENT span, so the statement is listed under the node the topology draws. Keep the two in step. A
          // database answers with no SERVER span, so no network alias is built for it and its peer is not resolved.
          def peer = attr("service.peer.name", "peer.service")
          if (!peer && hasAttr("server.address", "net.peer.name")) {
            def addr = attr("server.address", "net.peer.name")
            def port = attr("server.port", "net.peer.port")
            def peer = addr
            if (port) {
              def peer = addr + ":" + port
            }
          }
          if (!peer && hasAttr("peer.address")) {
            def peer = attr("peer.address")
          }
          if (!peer && hasAttr("url.full", "http.url")) {
            def peer = urlHost(attr("url.full", "http.url"))
          }
          // The cluster server-clusters.yml lists the address under, as otlp-general names the database.
          if (peer && !hasAttr("service.peer.name", "peer.service") && hasAttr("db.system.name", "db.system")) {
            def cluster = findServerClusterName(peer)
            if (cluster) {
              def peer = cluster
            }
          }
          if (!peer && hasAttr("db.system.name", "db.system")) {
            def peer = attr("db.system.name", "db.system")
            if (hasAttr("db.namespace", "db.name")) {
              def peer = peer + "/" + attr("db.namespace", "db.name")
            }
          }
          // A statement with no database to file it under would land on a service named `_blank`, where no
          // panel reads it.
          if (!peer) {
            abort {}
          }
          service peer
          // A span id is unique only within its trace; the agent path keys the record by segment and span.
          id meta.traceId + "-" + meta.spanId
          statement attr("db.query.text", "db.statement")
          latency meta.latency
        }
        sink {}
        persist {
          enforcer {}          // keep the span behind every slow statement, past this rule's samplers and the receiver's head sampling
        }
      }

# NetworkAddressAliasMappingListener, as a TAL rule for spans that SkyWalking agents send.
#
# The sw8 header carries the address the caller dialed, so an entry span alone names its own service as that
# address. The row is sent during the span loop, as the listener sends it, not in the build phase.

rules:
  - name: native-network-alias
    layer: GENERAL
    inputType: sw-native
    dsl: |
      filter {
        if (!traceAnalysis() || span.spanType != "Entry" || span.skipAnalysis) {
          abort {}
        }
        // Logged for every entry span the listener does not skip, before its MQ check
        log debug "service instance mapping listener parse reference"
        if (span.spanLayer == "MQ") {
          abort {}
        }
        extractor {
          foreach (ref in span.refsList) {
            if (ref.refType == "CrossProcess") {
              // Formatted as a service name before the gateway check, as the listener does
              def address = formatServiceName(ref.networkAddressUsedAtPeer)
              if (!isGateway(address)) {
                // NetworkAddressAliasSetup: this address, formatServiceName(segment().service),
                // formatInstanceName(segment().serviceInstance), representServiceNormal true, the minute of the
                // span's start; sent at this statement
                writeNetworkAlias address
              }
            }
          }
        }
      }

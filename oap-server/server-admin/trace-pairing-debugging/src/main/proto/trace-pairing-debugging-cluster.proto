syntax = "proto3";

package skywalking.v3.trace_pairing_debugging;

option java_multiple_files = true;
option java_package = "org.apache.skywalking.oap.server.admin.trace.pairing.cluster.v1";

// The RPCs the pairing debugging fans out to every OAP peer, on the admin-internal gRPC bus owned by `admin-server`
// (default port 17129). A call's halves meet on the node that owns its trace, so the capture is turned on and off on
// every node, and what it found is read from every node. Any node can take the REST request and call these on its
// peers. There is one capture per node, shared by every reader: no sessions. A read is a ping: a capture stops a
// minute after the latest one.
service TracePairingDebuggingClusterService {
  // Turn this node's capture on, afresh when it was off.
  rpc StartCapture(StartCaptureRequest) returns (CaptureAck) {}
  rpc StopCapture(StopCaptureRequest) returns (CaptureAck) {}
  // What this node's capture found, with its counts; a ping.
  rpc CollectPairings(CollectPairingsRequest) returns (CollectPairingsResponse) {}
}

message StartCaptureRequest {
  // The round the node that took the request runs, new or the one it already ran: a node that is off starts it, under
  // this id and start time; a node already capturing keeps its own round, whose id its ack names.
  int64 start_time = 1;
  string round_id = 2;
}

message StopCaptureRequest {
}

message CaptureAck {
  string nodeId = 1;
  // This node's capture as one JSON object: whether it is on, its round's id and start, and its latest read.
  string state = 2;
}

message CollectPairingsRequest {
}

message CollectPairingsResponse {
  string nodeId = 1;
  // The node's summary as one JSON object: its state, counts and lists.
  string summary = 2;
}


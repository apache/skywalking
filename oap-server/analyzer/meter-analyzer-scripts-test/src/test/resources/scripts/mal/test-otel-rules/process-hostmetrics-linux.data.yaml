script: oap-server/server-starter/src/main/resources/otel-rules/process-hostmetrics-linux.yaml
input:
  # This MAL runtime fixture deliberately supplies three same-identity samples
  # to exercise sum/max grouping independently of Collector transport. In the
  # production path, the Collector pre-aggregates same-name OS processes before
  # OTLP export. Different thread values also ensure process.count cannot
  # accidentally inherit process.threads.
  process_count:
    - labels: {node_identifier_host_name: test-host, process_name: java}
      value: 1.0
    - labels: {node_identifier_host_name: test-host, process_name: java}
      value: 1.0
    - labels: {node_identifier_host_name: test-host, process_name: java}
      value: 1.0
  process_threads:
    - labels: {node_identifier_host_name: test-host, process_name: java}
      value: 10.0
    - labels: {node_identifier_host_name: test-host, process_name: java}
      value: 20.0
    - labels: {node_identifier_host_name: test-host, process_name: java}
      value: 30.0
  process_cpu_utilization:
    - labels: {node_identifier_host_name: test-host, process_name: java, state: user}
      value: 0.10
    - labels: {node_identifier_host_name: test-host, process_name: java, state: system}
      value: 0.05
    - labels: {node_identifier_host_name: test-host, process_name: java, state: wait}
      value: 0.02
    - labels: {node_identifier_host_name: test-host, process_name: java, state: user}
      value: 0.20
    - labels: {node_identifier_host_name: test-host, process_name: java, state: system}
      value: 0.10
    - labels: {node_identifier_host_name: test-host, process_name: java, state: wait}
      value: 0.03
    - labels: {node_identifier_host_name: test-host, process_name: java, state: user}
      value: 0.05
    - labels: {node_identifier_host_name: test-host, process_name: java, state: system}
      value: 0.05
    - labels: {node_identifier_host_name: test-host, process_name: java, state: wait}
      value: 0.01
  process_memory_usage:
    - labels: {node_identifier_host_name: test-host, process_name: java}
      value: 1000.0
    - labels: {node_identifier_host_name: test-host, process_name: java}
      value: 2000.0
    - labels: {node_identifier_host_name: test-host, process_name: java}
      value: 3000.0
  process_memory_utilization:
    - labels: {node_identifier_host_name: test-host, process_name: java}
      value: 0.01
    - labels: {node_identifier_host_name: test-host, process_name: java}
      value: 0.02
    - labels: {node_identifier_host_name: test-host, process_name: java}
      value: 0.03
  process_open_handles:
    - labels: {node_identifier_host_name: test-host, process_name: java}
      value: 5.0
    - labels: {node_identifier_host_name: test-host, process_name: java}
      value: 7.0
    - labels: {node_identifier_host_name: test-host, process_name: java}
      value: 9.0
  process_uptime:
    - labels: {node_identifier_host_name: test-host, process_name: java}
      value: 100.0
    - labels: {node_identifier_host_name: test-host, process_name: java}
      value: 200.0
    - labels: {node_identifier_host_name: test-host, process_name: java}
      value: 150.0

expected:
  mp_process_linux_num_procs:
    samples:
      - labels: {node_identifier_host_name: test-host, process_name: java}
        value: 3.0
  mp_process_linux_num_threads:
    samples:
      - labels: {node_identifier_host_name: test-host, process_name: java}
        value: 60.0
  mp_process_linux_cpu_total_percent:
    samples:
      - labels: {node_identifier_host_name: test-host, process_name: java}
        value: 55.0
  mp_process_linux_cpu_user_percent:
    samples:
      - labels: {node_identifier_host_name: test-host, process_name: java}
        value: 35.0
  mp_process_linux_cpu_system_percent:
    samples:
      - labels: {node_identifier_host_name: test-host, process_name: java}
        value: 20.0
  mp_process_linux_memory_resident_bytes:
    samples:
      - labels: {node_identifier_host_name: test-host, process_name: java}
        value: 6000.0
  mp_process_linux_memory_resident_percent:
    samples:
      - labels: {node_identifier_host_name: test-host, process_name: java}
        value: 6.0
  mp_process_linux_open_handles:
    samples:
      - labels: {node_identifier_host_name: test-host, process_name: java}
        value: 21.0
  mp_process_linux_oldest_process_uptime_seconds:
    samples:
      - labels: {node_identifier_host_name: test-host, process_name: java}
        value: 200.0

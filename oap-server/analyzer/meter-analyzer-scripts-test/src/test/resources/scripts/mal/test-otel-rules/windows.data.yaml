script: oap-server/server-starter/src/main/resources/otel-rules/windows.yaml
input:
  windows_cpu_time_total:
    - labels:
        node_identifier_host_name: test-host
        mode: user
      value: 100.0
  # Native OpenTelemetry hostmetrics contract after Collector normalization.
  # Values are fixed for deterministic MAL assertions.
  system_cpu_logical_count:
    - labels:
        node_identifier_host_name: test-host
      value: 4.0
  system_cpu_time:
    - labels:
        node_identifier_host_name: test-host
        mode: user
      value: 20.0
    - labels:
        node_identifier_host_name: test-host
        mode: idle
      value: 80.0
  system_cpu_load_average_1m:
    - labels:
        node_identifier_host_name: test-host
      value: 1.25
  system_cpu_load_average_5m:
    - labels:
        node_identifier_host_name: test-host
      value: 0.75
  system_cpu_load_average_15m:
    - labels:
        node_identifier_host_name: test-host
      value: 0.5
  system_filesystem_usage:
    - labels:
        node_identifier_host_name: test-host
        mountpoint: "C:"
        state: free
      value: 60.0
    - labels:
        node_identifier_host_name: test-host
        mountpoint: "C:"
        state: used
      value: 40.0
  system_filehandles_allocated:
    - labels:
        node_identifier_host_name: test-host
      value: 123.0
  system_paging_usage:
    - labels:
        node_identifier_host_name: test-host
        device: 'C:\\pagefile.sys'
        state: used
      value: 30.0
    - labels:
        node_identifier_host_name: test-host
        device: 'C:\\pagefile.sys'
        state: free
      value: 70.0
  windows_cs_physical_memory_bytes:
    - labels:
      value: 100.0
  windows_os_physical_memory_free_bytes:
    - labels:
      value: 100.0
  windows_os_virtual_memory_free_bytes:
    - labels:
      value: 100.0
  windows_os_virtual_memory_bytes:
    - labels:
      value: 100.0
  windows_logical_disk_read_bytes_total:
    - labels:
        node_identifier_host_name: test-host
      value: 100.0
  windows_logical_disk_write_bytes_total:
    - labels:
        node_identifier_host_name: test-host
      value: 100.0
  windows_net_bytes_received_total:
    - labels:
        node_identifier_host_name: test-host
      value: 100.0
  windows_net_bytes_sent_total:
    - labels:
        node_identifier_host_name: test-host
      value: 100.0
expected:
  meter_win_cpu_total_percentage:
    entities:
      - scope: SERVICE
        service: test-host
        layer: OS_WINDOWS
    samples:
      - labels:
          node_identifier_host_name: test-host
        value: 3000.0
  meter_win_cpu_average_used:
    entities:
      - scope: SERVICE
        service: test-host
        layer: OS_WINDOWS
    samples:
      - labels:
          node_identifier_host_name: test-host
          mode: user
        value: 3000.0
  meter_win_memory_total:
    entities:
      - scope: SERVICE
        layer: OS_WINDOWS
    samples:
      - labels:
        value: 100.0
  meter_win_memory_available:
    entities:
      - scope: SERVICE
        layer: OS_WINDOWS
    samples:
      - labels:
        value: 100.0
  meter_win_memory_used:
    entities:
      - scope: SERVICE
        layer: OS_WINDOWS
    samples:
      - labels:
        value: 0.0
  meter_win_memory_virtual_memory_free:
    entities:
      - scope: SERVICE
        layer: OS_WINDOWS
    samples:
      - labels:
        value: 100.0
  meter_win_memory_virtual_memory_total:
    entities:
      - scope: SERVICE
        layer: OS_WINDOWS
    samples:
      - labels:
        value: 100.0
  meter_win_memory_virtual_memory_percentage:
    entities:
      - scope: SERVICE
        layer: OS_WINDOWS
    samples:
      - labels:
        value: -0.0
  meter_win_disk_read:
    entities:
      - scope: SERVICE
        service: test-host
        layer: OS_WINDOWS
    samples:
      - labels:
          node_identifier_host_name: test-host
        value: 25.0
  meter_win_disk_written:
    entities:
      - scope: SERVICE
        service: test-host
        layer: OS_WINDOWS
    samples:
      - labels:
          node_identifier_host_name: test-host
        value: 25.0
  meter_win_network_receive:
    entities:
      - scope: SERVICE
        service: test-host
        layer: OS_WINDOWS
    samples:
      - labels:
          node_identifier_host_name: test-host
        value: 0.0
  meter_win_network_transmit:
    entities:
      - scope: SERVICE
        service: test-host
        layer: OS_WINDOWS
    samples:
      - labels:
          node_identifier_host_name: test-host
        value: 0.0

  meter_win_cpu_cores_num:
    entities:
      - scope: SERVICE
        service: test-host
        layer: OS_WINDOWS
    samples:
      - labels:
          node_identifier_host_name: test-host
        value: 4.0
  meter_win_cpu_norm_percentage:
    entities:
      - scope: SERVICE
        service: test-host
        layer: OS_WINDOWS
    samples:
      - labels:
          node_identifier_host_name: test-host
        value: 125.0
  meter_win_cpu_load1:
    entities:
      - scope: SERVICE
        service: test-host
        layer: OS_WINDOWS
    samples:
      - labels:
          node_identifier_host_name: test-host
        value: 125.0
  meter_win_cpu_load5:
    entities:
      - scope: SERVICE
        service: test-host
        layer: OS_WINDOWS
    samples:
      - labels:
          node_identifier_host_name: test-host
        value: 75.0
  meter_win_cpu_load15:
    entities:
      - scope: SERVICE
        service: test-host
        layer: OS_WINDOWS
    samples:
      - labels:
          node_identifier_host_name: test-host
        value: 50.0
  meter_win_filesystem_percentage:
    entities:
      - scope: SERVICE
        service: test-host
        layer: OS_WINDOWS
    samples:
      - labels:
          node_identifier_host_name: test-host
          mountpoint: "C:"
        value: 40.0
  meter_win_filehandles_allocated:
    entities:
      - scope: SERVICE
        service: test-host
        layer: OS_WINDOWS
    samples:
      - labels:
          node_identifier_host_name: test-host
        value: 123.0
  meter_win_memory_pagefile_free:
    entities:
      - scope: SERVICE
        service: test-host
        layer: OS_WINDOWS
    samples:
      - labels:
          node_identifier_host_name: test-host
        value: 70.0
  meter_win_memory_pagefile_total:
    entities:
      - scope: SERVICE
        service: test-host
        layer: OS_WINDOWS
    samples:
      - labels:
          node_identifier_host_name: test-host
        value: 100.0
  meter_win_memory_pagefile_percentage:
    entities:
      - scope: SERVICE
        service: test-host
        layer: OS_WINDOWS
    samples:
      - labels:
          node_identifier_host_name: test-host
        value: 30.0

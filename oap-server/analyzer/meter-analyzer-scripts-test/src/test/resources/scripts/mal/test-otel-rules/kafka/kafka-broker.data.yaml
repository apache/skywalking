script: oap-server/server-starter/src/main/resources/otel-rules/kafka/kafka-broker.yaml
input:
  process_cpu_seconds_total:
    - labels:
        cluster: test-cluster
        broker: test-broker
      value: 100.0
  jvm_memory_bytes_used:
    - labels:
        cluster: test-cluster
        broker: test-broker
        area: heap
      value: 100.0
  jvm_memory_bytes_max:
    - labels:
        cluster: test-cluster
        broker: test-broker
        area: heap
      value: 100.0
  kafka_server_brokertopicmetrics_messagesin_total:
    # Kafka's all-topics total (no `topic` label) beside the per-topic series, as the JMX exporter exports them.
    - labels:
        cluster: test-cluster
        broker: test-broker
      value: 400.0
    - labels:
        cluster: test-cluster
        broker: test-broker
        topic: topic-a
      value: 300.0
    - labels:
        cluster: test-cluster
        broker: test-broker
        topic: topic-b
      value: 100.0
  kafka_server_brokertopicmetrics_bytesin_total:
    - labels:
        cluster: test-cluster
        broker: test-broker
      value: 8000.0
    - labels:
        cluster: test-cluster
        broker: test-broker
        topic: topic-a
      value: 6000.0
    - labels:
        cluster: test-cluster
        broker: test-broker
        topic: topic-b
      value: 2000.0
  kafka_server_brokertopicmetrics_bytesout_total:
    - labels:
        cluster: test-cluster
        broker: test-broker
      value: 4800.0
    - labels:
        cluster: test-cluster
        broker: test-broker
        topic: topic-a
      value: 3600.0
    - labels:
        cluster: test-cluster
        broker: test-broker
        topic: topic-b
      value: 1200.0
  kafka_server_brokertopicmetrics_replicationbytesin_total:
    - labels:
        cluster: test-cluster
        broker: test-broker
      value: 100.0
  kafka_server_brokertopicmetrics_replicationbytesout_total:
    - labels:
        cluster: test-cluster
        broker: test-broker
      value: 300.0
  kafka_server_replicamanager_underreplicatedpartitions:
    - labels:
        cluster: test-cluster
        broker: test-broker
      value: 100.0
  kafka_server_replicamanager_underminisrpartitioncount:
    - labels:
        cluster: test-cluster
        broker: test-broker
      value: 100.0
  kafka_server_replicamanager_partitioncount:
    - labels:
        cluster: test-cluster
        broker: test-broker
      value: 100.0
  kafka_server_replicamanager_leadercount:
    - labels:
        cluster: test-cluster
        broker: test-broker
      value: 100.0
  kafka_server_replicamanager_isrshrinks_total:
    - labels:
        cluster: test-cluster
        broker: test-broker
      value: 100.0
  kafka_server_replicamanager_isrexpands_total:
    - labels:
        cluster: test-cluster
        broker: test-broker
      value: 200.0
  kafka_server_replicafetchermanager_maxlag:
    - labels:
        cluster: test-cluster
        broker: test-broker
      value: 100.0
  kafka_server_delayedoperationpurgatory_purgatorysize:
    - labels:
        cluster: test-cluster
        broker: test-broker
        delayedOperation: Produce
      value: 100.0
  jvm_gc_collection_seconds_count:
    - labels:
        cluster: test-cluster
        broker: test-broker
        gc: G1 Young Generation
      value: 100.0
  kafka_network_requestmetrics_requests_total:
    - labels:
        cluster: test-cluster
        broker: test-broker
        request: Produce
      value: 100.0
  kafka_network_requestmetrics_requestqueuetimems:
    - labels:
        cluster: test-cluster
        broker: test-broker
        request: Produce
        quantile: "0.50"
      value: 25.0
    # Other quantiles must not leak into the p50 rules.
    - labels:
        cluster: test-cluster
        broker: test-broker
        request: Produce
        quantile: "0.99"
      value: 999.0
  kafka_network_requestmetrics_remotetimems:
    - labels:
        cluster: test-cluster
        broker: test-broker
        request: Produce
        quantile: "0.50"
      value: 25.0
    - labels:
        cluster: test-cluster
        broker: test-broker
        request: Produce
        quantile: "0.99"
      value: 999.0
  kafka_network_requestmetrics_responsequeuetimems:
    - labels:
        cluster: test-cluster
        broker: test-broker
        request: Produce
        quantile: "0.50"
      value: 25.0
    - labels:
        cluster: test-cluster
        broker: test-broker
        request: Produce
        quantile: "0.99"
      value: 999.0
  kafka_network_requestmetrics_responsesendtimems:
    - labels:
        cluster: test-cluster
        broker: test-broker
        request: Produce
        quantile: "0.50"
      value: 25.0
    - labels:
        cluster: test-cluster
        broker: test-broker
        request: Produce
        quantile: "0.99"
      value: 999.0
  kafka_network_socketserver_networkprocessoravgidlepercent:
    # A 0..1 ratio gauge, not a counter.
    - labels:
        cluster: test-cluster
        broker: test-broker
      value: 0.75
  kafka_server_brokertopicmetrics_totalfetchrequests_total:
    - labels:
        cluster: test-cluster
        broker: test-broker
      value: 2400.0
    - labels:
        cluster: test-cluster
        broker: test-broker
        topic: topic-a
      value: 1600.0
    - labels:
        cluster: test-cluster
        broker: test-broker
        topic: topic-b
      value: 800.0
  kafka_server_brokertopicmetrics_totalproducerequests_total:
    - labels:
        cluster: test-cluster
        broker: test-broker
      value: 1200.0
    - labels:
        cluster: test-cluster
        broker: test-broker
        topic: topic-a
      value: 800.0
    - labels:
        cluster: test-cluster
        broker: test-broker
        topic: topic-b
      value: 400.0

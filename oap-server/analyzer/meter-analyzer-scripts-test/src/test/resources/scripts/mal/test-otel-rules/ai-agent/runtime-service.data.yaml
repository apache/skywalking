# Three sessions from two senders on two models, so each rule's sum over what it does not keep is visible:
# session.id always, the sender at service level, the model and the source where the rule does not keep them.
script: oap-server/server-starter/src/main/resources/otel-rules/ai-agent/runtime-service.yaml

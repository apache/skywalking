# Dedicated to the source-attribution contract: SourceFile must name the .java actually written
# beside the .class, and no bytecode line may be attributed to a line that is not the statement
# it came from.
#
# TEST-ONLY on purpose. The bundled LAL configs change with feature work, and an assertion about
# generated-file geometry pinned to one of them would break for reasons unrelated to attribution.
# Nothing here is a copy of a shipped rule.
#
# The rules below deliberately differ in GENERATED SHAPE, because that shape is what the geometry
# depends on: how many private methods precede execute(), and therefore where any line would fall.
rules:
  # Minimal: no extractor, so the fewest private methods.
  - name: attribution-minimal
    layer: GENERAL
    dsl: |
      filter {
        text {
          abortOnFailure false
        }
        sink {
        }
      }

  # One extractor: adds an _extractor() private method ahead of execute().
  - name: attribution-one-extractor
    layer: GENERAL
    dsl: |
      filter {
        json {}
        extractor {
          service parsed.service as String
          endpoint parsed.endpoint as String
        }
        sink {
        }
      }

  # Two extractors plus a conditional: the most private methods, so the largest geometry shift.
  # If a line number were ever emitted from a fixed offset, this rule is where it would be wrong.
  - name: attribution-multi-block
    layer: GENERAL
    dsl: |
      filter {
        json {}
        extractor {
          service parsed.service as String
        }
        if (tag("LOG_KIND") == "SLOW_SQL") {
          extractor {
            endpoint parsed.endpoint as String
          }
        }
        sink {
        }
      }
